          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
          - name: limit
            in: query
            description: Tamaño inicial; no combinar con cursor.
            schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 20
          - name: cursor
            in: query
            description: Cursor firmado ligado al usuario, emisor y padre. Enviar sólo cursor al navegar.
            schema:
              type: string
        responses:
          "200":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/PaginaCredencialesSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
      post:
        tags:
          - Integraciones SEP
        operationId: crearCredencialSEP
        summary: Crea una credencial de integración
        description: "Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. Los bodies son estrictos; no aceptan emisor, usuario, cliente interno ni scopes. "
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuerpoCredencialSEP"
        responses:
          "201":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/RespuestaCrearCredencialSEP"
            headers:
              Cache-Control:
                schema:
                  type: string
                  example: no-store
                description: Impide almacenar la respuesta con el secreto.
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
    /api/v2/emisores/{id-emisor}/integraciones-sep/{integracion-id}/credenciales/{credencial-id}:
      delete:
