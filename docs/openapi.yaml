        SolicitudIniciarSesion:
            type: object
            description: Credenciales de acceso al panel web.
            required: [email, contrasena, mantener_sesion]
            properties:
                email:
                    type: string
                    format: email
                    description: Email registrado del usuario.
                    example: usuario@example.com
                contrasena:
                    type: string
                    format: password
                    description: Contraseña actual del usuario.
                mantener_sesion:
                    type: boolean
                    description: Si es `true`, solicita una sesión persistente; si es `false`, usa la duración corta configurada por el servicio.
        SolicitudRegistrarUsuario:
            type: object
            description: Datos de la nueva cuenta de usuario.
            required: [nombre, apellido, email, contrasena]
            properties:
                nombre:
                    type: string
                    description: Nombre de la persona usuaria.
                    example: Ana
                apellido:
                    type: string
                    description: Apellido de la persona usuaria.
                    example: Pérez
                email:
                    type: string
                    format: email
                    description: Email único de la cuenta; recibirá el enlace de verificación.
                    example: ana.perez@example.com
                contrasena:
                    type: string
                    format: password
                    description: Contraseña inicial de la cuenta.
        SolicitudRegistrarSuperadmin:
            type: object
            description: Datos del primer usuario superadministrador durante el bootstrap.
            required: [nombre, apellido, email, contrasena]
            properties:
                nombre:
                    type: string
                    description: Nombre de la persona superadministradora.
                    example: Ana
                apellido:
                    type: string
                    description: Apellido de la persona superadministradora.
                    example: Pérez
                email:
                    type: string
                    format: email
                    description: Email único de la cuenta superadministradora.
                    example: admin@example.com
                contrasena:
                    type: string
                    format: password
                    description: Contraseña inicial de la cuenta superadministradora.
        SolicitudRecuperarCuenta:
            type: object
            description: Cuenta para la que se solicita un enlace de recuperación.
            required: [email]
            properties:
                email:
                    type: string
                    format: email
                    description: Email de la cuenta registrada.
                    example: usuario@example.com
        SolicitudRestablecerContrasena:
            type: object
            description: Nueva contraseña que reemplaza a la anterior al validar el token de la URL.
            required: [contrasena]
            properties:
                contrasena:
                    type: string
                    format: password
                    description: Nueva contraseña de la cuenta.
        RespuestaIniciarSesion:
            type: object
            required: [token_autenticacion]
            properties:
                token_autenticacion:
                    type: string
        RespuestaRegistrarUsuario:
            type: object
            required: [id_usuario]
            properties:
                id_usuario:
                    type: string
        RespuestaRegistrarSuperadmin:
            type: object
            required: [id_usuario, token_autenticacion]
            properties:
                id_usuario:
                    type: string
                token_autenticacion:
                    type: string
        EstadoSistema:
            type: object
            required: [estado, registro_superadmin_habilitado]
            properties:
                estado:
                    type: string
                    enum: [bootstrap, operativo]
                registro_superadmin_habilitado:
                    type: boolean
        ResumenRolSesion:
            type: object
            required: [rol_id, slug, nombre]
            properties:
                rol_id:
                    type: string
                slug:
                    type: string
                nombre:
                    type: string
        ResumenPermisoSesion:
            type: object
            required: [permiso_id, slug, nombre]
            properties:
                permiso_id:
                    type: string
                slug:
                    type: string
                nombre:
                    type: string
        SesionUsuario:
            type: object
            required: [id_usuario, nombre, apellido, email, email_verificado, email_verificado_en, roles, permisos]
            properties:
                id_usuario:
                    type: string
                nombre:
                    type: string
                apellido:
                    type: string
                email:
                    type: string
