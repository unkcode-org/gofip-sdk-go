            type: string
            description: Estado de la credencial; una credencial revocada no vuelve a activarse.
            enum: [active, revoked]
        AlcanceIntegracion:
            type: string
            description: Operación que el backend externo puede solicitar a GOFIP; no concede permisos al navegador Embedded.
            enum: ["embedded_session:create"]
        PermisoEmbedded:
            type: string
            description: Permiso funcional de credencial y snapshot Embedded; separado del scope M2M. invoices:create está reservado y no habilita emisión manual Embedded. WhatsApp y ARCA tienen UI parcial.
            enum:
                - "invoices:read"
                - "invoices:create"
                - "customers:read"
                - "customers:write"
                - "points_of_sale:read"
                - "points_of_sale:write"
                - "recurring_invoices:read"
                - "recurring_invoices:write"
                - "whatsapp:read"
                - "whatsapp:write"
                - "arca:read"
                - "arca:write"
        CodigoErrorIntegracionEmbedded:
            type: string
            description: >-
                Código estable de Embedded: 18000 cliente no encontrado; 18001 cliente deshabilitado;
                18002 origen inválido; 18003 datos de cliente inválidos; 18008 credencial no encontrada; 18009 credencial revocada; 18010
                credencial vencida; 18011 credencial inválida; 18012 datos de credencial inválidos;
                18013 alcance inválido; 18014 alcance requerido ausente; 18015 permiso Embedded inválido;
                18016 solicitud de bootstrap inválida; 18017 permiso no autorizado; 18018 bootstrap no disponible;
                18019 fallo de persistencia del bootstrap.
            enum: ["18000", "18001", "18002", "18003", "18008", "18009", "18010", "18011", "18012", "18013", "18014", "18015", "18016", "18017", "18018", "18019"]
        DetallesErrorIntegracionEmbedded:
            allOf:
                - {$ref: "#/components/schemas/DetallesError"}
