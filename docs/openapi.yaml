            operationId: listarClientesEmisor
            summary: Lista los clientes del emisor
            description: >-
                Devuelve los clientes activos del emisor ordenados por nombre y UUID. Admite
                búsqueda parcial por nombre o razón social, número de documento, email o teléfono,
                y paginación keyset con cursores firmados. El parámetro `q` debe reenviarse junto
                con cada cursor para conservar la búsqueda.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
                - $ref: "#/components/parameters/LimiteClientes"
                - $ref: "#/components/parameters/CursorClientes"
                - $ref: "#/components/parameters/BusquedaClientes"
            responses:
                "200":
                    description: Página de clientes activos y cursores de navegación
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaginaClientes"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
