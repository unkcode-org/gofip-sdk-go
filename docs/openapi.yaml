openapi: 3.0.3
info:
    title: GO ARCA API
    version: "2.0"
    description: API REST para gestión de emisores, puntos de venta, credenciales API y facturación electrónica con ARCA.
    contact:
        name: Equipo GOFIP
        email: soporte@unkcode.com
servers:
    - url: /
security:
    - BearerAuth: []
    - CookieAuth: []
tags:
    - name: Utilidades
    - name: Autenticación
    - name: Emisores
    - name: Puntos de venta
    - name: Credenciales
    - name: Admin
    - name: ARCA Catálogos
    - name: ARCA Padrón
    - name: ARCA Transacciones
    - name: Documentos
paths:
    /api/v2/salud:
        get:
            tags: [Utilidades]
            summary: Verificación de estado del servicio
            security: []
            responses:
                "200":
                    description: OK
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: OK

    /api/v2/autenticacion/iniciar-sesion:
        post:
            tags: [Autenticación]
            summary: Inicia sesión
            description: Autentica credenciales y devuelve el token JWT en una cookie y en el cuerpo.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudIniciarSesion"
            responses:
                "200":
                    description: Sesión autenticada
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                            description: Cookie jwt HTTP Only.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaIniciarSesion"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/autenticacion/registrar:
        post:
            tags: [Autenticación]
            summary: Registra un usuario
            description: Crea una cuenta de usuario y envía un correo de verificación.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudRegistrarUsuario"
            responses:
                "200":
                    description: Usuario registrado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaRegistrarUsuario"
                "400":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/autenticacion/recuperar-cuenta:
        post:
            tags: [Autenticación]
            summary: Solicita recuperación de cuenta
            description: Envía un correo con un enlace para restablecer la contraseña.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudRecuperarCuenta"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/autenticacion/restablecer-contrasena/{token}:
        post:
            tags: [Autenticación]
            summary: Restablece contraseña
            description: Define una nueva contraseña utilizando un token válido.
            security: []
            parameters:
                - $ref: "#/components/parameters/Token"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudRestablecerContrasena"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/autenticacion/cerrar-sesion:
        post:
            tags: [Autenticación]
            summary: Cierra sesión
            description: Invalida la cookie de autenticación del panel web.
            security:
                - CookieAuth: []
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"

    /api/v2/autenticacion/verificar-email/{token}:
        post:
            tags: [Autenticación]
            summary: Verifica email
            description: Confirma el correo del usuario a partir del token recibido por email.
            security: []
            parameters:
                - $ref: "#/components/parameters/Token"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/emisores:
        get:
            tags: [Emisores]
            summary: Lista emisores del usuario autenticado
            security:
                - CookieAuth: []
            responses:
                "200":
                    description: Emisores
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaEmisores"
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        put:
            tags: [Emisores]
            summary: Crea un emisor
            description: Crea un emisor asociado al usuario autenticado y almacena el certificado digital recibido.
            security:
                - CookieAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: "#/components/schemas/MultipartCrearEmisor"
            responses:
                "200":
                    description: Emisor creado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCrearEmisor"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/emisores/{id-emisor}:
        patch:
            tags: [Emisores]
            summary: Actualiza un emisor
            description: Modifica datos fiscales y, si se envían ambos archivos, reemplaza certificado y clave privada.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: "#/components/schemas/MultipartActualizarEmisor"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        delete:
            tags: [Emisores]
            summary: Elimina un emisor
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/emisores/{id-emisor}/puntos-venta:
        get:
            tags: [Puntos de venta]
            summary: Lista puntos de venta del emisor
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
            responses:
                "200":
                    description: Puntos de venta
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaPuntosVentaEmisor"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        put:
            tags: [Puntos de venta]
            summary: Crea un punto de venta
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudPuntoVenta"
            responses:
                "200":
                    description: Punto de venta creado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCrearPuntoVenta"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/emisores/{id-emisor}/puntos-venta/{punto-venta-id}:
        patch:
            tags: [Puntos de venta]
            summary: Actualiza un punto de venta
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
                - $ref: "#/components/parameters/IdPuntoVenta"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudPuntoVenta"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        delete:
            tags: [Puntos de venta]
            summary: Elimina un punto de venta
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdEmisor"
                - $ref: "#/components/parameters/IdPuntoVenta"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/puntos-venta/{punto-venta-id}/credenciales:
        get:
            tags: [Credenciales]
            summary: Lista credenciales API del punto de venta
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
            responses:
                "200":
                    description: Credenciales del punto de venta
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCredencialesPuntoVenta"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        post:
            tags: [Credenciales]
            summary: Crea una credencial API para un punto de venta
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudCrearCredencial"
            responses:
                "200":
                    description: Credencial creada. La API key completa solo se devuelve en esta respuesta.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCrearCredencial"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/credenciales/{credencial-id}/regenerar:
        post:
            tags: [Credenciales]
            summary: Regenera la API key de una credencial
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdCredencial"
            responses:
                "200":
                    description: API key regenerada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaRegenerarCredencial"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/credenciales/{credencial-id}/revocar:
        patch:
            tags: [Credenciales]
            summary: Revoca una credencial
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdCredencial"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/credenciales/{credencial-id}/autorizaciones:
        get:
            tags: [Credenciales]
            summary: Lista autorizaciones de una credencial
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdCredencial"
            responses:
                "200":
                    description: Autorizaciones de la credencial
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaAutorizacionesCredencial"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        post:
            tags: [Credenciales]
            summary: Crea una autorización de uso de credencial
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdCredencial"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudCrearAutorizacionCredencial"
            responses:
                "200":
                    description: Autorización creada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCrearAutorizacionCredencial"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/credenciales/autorizaciones/{autorizacion-id}:
        patch:
            tags: [Credenciales]
            summary: Habilita o deshabilita una autorización
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdAutorizacion"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudActualizarAutorizacionCredencial"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        delete:
            tags: [Credenciales]
            summary: Elimina una autorización
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdAutorizacion"
            responses:
                "200":
                    $ref: "#/components/responses/Nulo"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/tipos-autorizacion:
        get:
            tags: [Credenciales]
            summary: Lista tipos de autorización disponibles
            security:
                - CookieAuth: []
            responses:
                "200":
                    description: Tipos de autorización
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaTiposAutorizacion"
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/admin/metricas:
        get:
            tags: [Admin]
            summary: Obtiene métricas básicas globales
            security:
                - CookieAuth: []
            responses:
                "200":
                    description: Métricas
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MetricasAdmin"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/disponibilidad:
        get:
            tags: [Utilidades]
            summary: Consulta disponibilidad de la API
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Adaptador disponible
                    content:
                        application/json:
                            schema:
                                type: string
                                example: pong
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/medios-pago:
        get:
            tags: [Utilidades]
            summary: Lista medios de pago locales
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Medios de pago locales
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaMediosPago"
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/documentos/comprobante:
        post:
            tags: [Documentos]
            summary: Genera PDF/HTML de un comprobante autorizado
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudDocumentoComprobante"
            responses:
                "200":
                    $ref: "#/components/responses/Archivo"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/templates-oficiales:
        get:
            tags: [Documentos]
            summary: Lista los templates oficiales disponibles
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Última versión estable válida de cada template
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaTemplatesOficiales"
                "401":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/templates-oficiales/{slug}/documentos:
        post:
            tags: [Documentos]
            summary: Genera un documento no fiscal desde un template oficial
            security:
                - BearerAuth: []
            parameters:
                - name: slug
                  in: path
                  required: true
                  schema:
                      type: string
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                      maxLength: 120
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SolicitudGenerarDocumentoNoFiscal"
            responses:
                "200":
                    description: Documento recuperado por idempotencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaDocumentoNoFiscal"
                "201":
                    description: Documento generado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaDocumentoNoFiscal"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/documentos-no-fiscales/{documento-id}/pdf:
        get:
            tags: [Documentos]
            summary: Obtiene o regenera el PDF de un documento no fiscal
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/DocumentoID"
            responses:
                "200":
                    description: URL firmada temporal del PDF
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaDocumentoNoFiscal"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/factura/{documento-id}/pdf:
        post:
            tags: [Documentos]
            summary: Genera o regenera el PDF de una factura autorizada
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/DocumentoID"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudGenerarPDFFactura"
            responses:
                "200":
                    description: URL firmada de descarga del PDF
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaPDFFactura"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/arca/estado:
        get:
            tags: [ARCA Catálogos]
            summary: Consulta estado de WSFE
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/AmbienteARCA"
            responses:
                "200":
                    description: Estado del servicio WSFE
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaEstadoServicio"
                "401":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/arca/puntos-venta:
        get:
            tags: [ARCA Catálogos]
            summary: Lista puntos de venta fiscales desde ARCA
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/AmbienteARCA"
            responses:
                "200":
                    description: Puntos de venta fiscales
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaPuntosVentaARCA"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

