                        name: {type: string, minLength: 1, maxLength: 120, description: Nombre de la Integration Key.}
                        permissions: *a5
                        scopes:
                            type: array
                            uniqueItems: true
                            description: Alcances M2M explícitos; omitirlos crea una credencial autenticable sin autorizaciones.
                            items: {$ref: "#/components/schemas/AlcanceIntegracion"}
                        expires_at: {type: string, format: date-time, description: Vencimiento futuro opcional.}
        CuerpoSolicitudCanjearBootstrapEmbedded:
            type: object
