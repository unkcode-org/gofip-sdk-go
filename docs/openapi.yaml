            responses: {"200": {description: Metadata validada, content: {application/json: {schema: {$ref: "#/components/schemas/CredencialARCAEmbedded"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
    /api/v2/embed/arca/credenciales/{credencial-id}/activar:
