    /api/v2/embedded/bootstrap/exchange:
        post:
            tags: [Integraciones Embedded]
            operationId: canjearBootstrapEmbedded
            summary: Canjea un bootstrap Embedded de un solo uso
            description: >-
                Recibe el bootstrap opaco exclusivamente en el cuerpo POST y lo consume
                atómicamente después de exigir que el Origin canónico sea el origen de
                aplicación derivado por el servidor desde EMBEDDED_PUBLIC_BASE_URL. Un
                Origin ausente, null, malformado o distinto falla antes de consultar Redis
                y no consume el bootstrap. No requiere IntegrationKey, cookie, JWT ni credencial de
                facturación. Al consumirlo crea una sesión de navegador opaca respaldada
                por Redis y entrega su secreto únicamente en el cuerpo no-cacheable. El token
                de bootstrap vence pronto y un replay falla con la misma respuesta no
                autorizada que un token inválido o inexistente. La respuesta entrega un
                token CSRF derivado y ligado a la sesión.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: {$ref: "#/components/schemas/CuerpoSolicitudCanjearBootstrapEmbedded"}
            responses:
                "200":
                    description: Bootstrap consumido y sesión Embedded de navegador creada.
                    headers:
                        Cache-Control:
                            schema: {type: string, example: no-store}
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/RespuestaCanjearBootstrapEmbedded"}
                "400": {$ref: "#/components/responses/Error"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "500": {$ref: "#/components/responses/Error"}

    /api/v2/embedded/bootstraps:
        post:
            tags: [Integraciones Embedded]
            operationId: crearBootstrapEmbedded
            summary: Crea un bootstrap de recuperación Embedded
            description: >-
                Las sesiones Embedded heredan automáticamente todos los permisos configurados en la credencial de integración autenticada.
                Autentica exclusivamente IntegrationKey con scope embedded_session:create y deriva el emisor de su integración.
                POST sin cuerpo ni parámetros query. No acepta permisos ni selección de emisor del consumidor.
                Una credencial sin permisos Embedded recibe 403. La capacidad contiene un snapshot; cambios posteriores
                sólo afectan nuevas capacidades. El bootstrap es de un solo uso; no representa aún una sesión de navegador.
            security: [{IntegrationKeyAuth: []}]
            responses:
                "201":
                    description: Bootstrap de un solo uso creado.
                    headers:
                        Cache-Control: {schema: {type: string, example: no-store}}
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/RespuestaCrearBootstrapEmbedded"}
                "400": {$ref: "#/components/responses/Error"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
                "500": {$ref: "#/components/responses/Error"}

    /api/v2/embedded/sessions:
        post:
            tags: [Integraciones Embedded]
            operationId: crearSesionEmbedded
            summary: Crea un bootstrap Embedded de un solo uso
