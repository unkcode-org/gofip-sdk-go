            responses: {"200": {description: Sesión encontrada, content: {application/json: {schema: {$ref: "#/components/schemas/SesionWhatsApp"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}}
