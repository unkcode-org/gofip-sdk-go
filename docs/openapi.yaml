openapi: 3.0.3
info:
    title: GO ARCA API
    version: "4.0.0"
    description: >-
        API REST para gestión de emisores, puntos de venta, credenciales API y
        facturación electrónica con ARCA. Los POST M2M de sesión/bootstrap Embedded no llevan cuerpo. Los cuerpos JSON de entrada usan el
        sobre `{"data": ...}` que declara cada operación. Los errores se devuelven con
        la estructura `DetallesError`, compatible con RFC 7807; `detail` se localiza
        en español por defecto y acepta `Accept-Language: es` o `en`.
    contact:
        name: Equipo GOFIP
        email: soporte@unkcode.com
servers:
    - url: /
security:
    - BearerAuth: []
    - CookieAuth: []
tags:
    - name: Facturación persistida
      description: Lectura fiscal en MySQL para todas las facturas del emisor autenticado, sin consultar ARCA.
    - name: Utilidades
      description: Diagnóstico y catálogos locales que no invocan operaciones fiscales.
    - name: Sistema
      description: Inicialización y estado operativo de la instalación.
    - name: Autenticación
      description: Registro, sesión web, verificación de email y recuperación de cuentas.
    - name: Emisores
      description: Identidades fiscales del usuario e integración de servicios delegados en ARCA.
    - name: Clientes
      description: Agenda de receptores fiscales administrada por cada emisor desde la sesión web.
    - name: Puntos de venta
      description: Configuración local de puntos de venta asociados a un emisor.
    - name: Credenciales
      description: API keys de puntos de venta y sus restricciones de origen.
    - name: Facturación web
      description: Consulta, emisión y representación de facturas usando la sesión del panel.
    - name: Facturación recurrente
      description: Programación mensual web de comprobantes para clientes guardados y seguimiento de sus entregas.
    - name: Integraciones SEP
      description: Configuración de Sistemas Externos Personalizados del emisor propio.
    - name: Admin
      description: Operaciones globales reservadas a usuarios con permisos administrativos.
    - name: Integraciones Embedded
      description: Administración de integraciones de un único emisor y credenciales M2M para la futura superficie Embedded.
    - name: API Embedded
      description: Operaciones de navegador autenticadas exclusivamente mediante Authorization EmbeddedSession y acotadas al emisor de la sesión.
    - name: ARCA Catálogos
      description: Catálogos WSFE compartidos y cacheados, además de consultas dinámicas de estado, cotización y puntos de venta.
    - name: ARCA Padrón
      description: Consultas de personas en los servicios de padrón delegados por el emisor.
    - name: ARCA Transacciones
      description: Emisión y consulta de comprobantes fiscales en WSFE.
    - name: Documentos
      description: Generación y recuperación de representaciones PDF o HTML fiscales y no fiscales.
    - name: WhatsApp
      description: Gestión de sesiones OpenWA y envío genérico de mensajes para cada emisor.
paths:
    /api/v2/facturas/importaciones:
      post:
        tags:
        - Facturación persistida
        operationId: importarFacturaHistorica
        summary: Importa una factura Legacy ya autorizada
        description: La credencial API válida puede importar únicamente comprobantes
          correspondientes al mismo emisor y punto de venta al que está asociada.
          El backend verifica CredencialPuntoVenta -> PuntoVenta -> Emisor y exige
          que factura.punto_venta coincida con el número fiscal de ese PuntoVenta.
          Un PV fuera de ese scope devuelve 404 sin consultar ARCA.
          Legacy siempre consulta FECompConsultar en ARCA Producción;
          X-ARCA-Ambiente no selecciona ambiente. No admite emisor ni ambiente en el body.
          Nunca autoriza, genera PDF ni envía correo. Idempotency-Key es obligatorio,
          separado de emisión y acotado a emisor_id+credencial_id+punto_venta_id;
          reutilizarlo con otros datos produce 409. La identidad emisor+PV+tipo+número
          es única aun entre credenciales. Las referencias son únicas dentro del
          mismo scope de importación; external_reference no tiene unicidad global
          ni identifica fiscalmente el comprobante. Replays completados recuperan
          el resultado guardado; fallos de consulta pueden reanudarse con la misma
          solicitud. Un fallo nunca habilita emisión.
        security:
        - BearerAuth: []
        parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave estable de importación; no comparte el espacio de claves
            de EmitirFactura.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: X-External-Reference
          in: header
          required: false
          description: Referencia exacta dentro del scope emisor_id+credencial_id+punto_venta_id.
          schema:
            type: string
            maxLength: 120
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuerpoSolicitudImportarFactura'
        responses:
          '200':
            description: Identidad existente compatible; mismo documento y origen original.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RespuestaImportarFactura'
          '201':
            description: Factura histórica verificada y persistida.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RespuestaImportarFactura'
          '400':
            description: Solicitud inválida, campo desconocido o emisor/ambiente no permitido
              en el body.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '401':
            description: Credencial inválida o expirada.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '403':
            description: Credencial revocada o acceso denegado por las reglas normales de autenticación.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '404':
            description: Comprobante inexistente en ARCA o recurso ajeno no accesible.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '409':
            description: Conflicto fiscal, CAE/mismatch, idempotencia o referencia vinculada
              a otro documento.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '413':
            description: Body mayor a 1 MiB.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '500':
            description: Fallo de persistencia; repetir la misma importación permite recuperar un commit previo sin emitir.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '502':
            description: Respuesta fiscal inválida o incompleta.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
          '503':
            description: Consulta ARCA indisponible o timeout; no se crea una factura.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/DetallesError'
    /api/v2/facturas/cae/{cae}:
        get:
            tags:
            - Facturación persistida
            operationId: obtenerFacturaPersistidaPorCAE
            summary: Obtiene una factura persistida por CAE
            description: Resuelve el emisor exclusivamente desde la API key de un punto de venta. Autoriza lectura de todos los
                puntos de venta del mismo emisor; no amplía permisos de emisión. Consulta exclusivamente MySQL, no utiliza ARCA
                como fallback y no modifica el estado fiscal. No admite emisor ni ambiente en parámetros; el ambiente no está
                persistido. Los parámetros desconocidos o repetidos se rechazan. Devuelve 404 si no hay coincidencias accesibles
                y 409 (code 13006) si hay varias, aun después de filtrar. No elige una arbitrariamente.
            security:
            -   BearerAuth: []
            parameters:
            -   name: cae
                in: path
                required: true
                description: CAE tal como se encuentra persistido. Se conserva como string, incluidos ceros iniciales; acepta
                    históricos de hasta 20 dígitos.
                schema:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: ^[0-9]{1,20}$
            -   name: documento_id
                in: query
                required: false
                description: Restringe al documento estable de GOFIP dentro del emisor autorizado.
                schema:
                    type: string
                    format: uuid
            -   name: punto_venta
                in: query
                required: false
                description: Número fiscal del punto de venta, no su UUID.
                schema:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
            -   name: tipo_comprobante
                in: query
                required: false
                description: Tipo de comprobante persistido.
                schema:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
            -   name: numero_comprobante
                in: query
                required: false
                description: Número de comprobante persistido.
                schema:
                    type: integer
                    minimum: 1
                    format: int64
            responses:
                '200':
                    description: Factura fiscal persistida. No consulta ARCA ni regenera documentos.
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                                example: no-store
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RespuestaFacturaPersistida'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '404':
                    $ref: '#/components/responses/Error'
                '500':
                    $ref: '#/components/responses/Error'
                '409':
                    description: CAE ambiguo dentro del emisor autenticado. Agregar filtros; no se devuelven candidatos de otros
                        emisores.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetallesError'
    /api/v2/facturas/{documento-id}:
        get:
            tags:
            - Facturación persistida
            operationId: obtenerFacturaPersistidaPorId
            summary: Obtiene una factura persistida por documento ID
            description: Resuelve el emisor exclusivamente desde la API key de un punto de venta. Autoriza lectura de todos los
                puntos de venta del mismo emisor; no amplía permisos de emisión. Consulta exclusivamente MySQL, no utiliza ARCA
                como fallback y no modifica el estado fiscal. No admite emisor ni ambiente en parámetros; el ambiente no está
                persistido. Los parámetros desconocidos o repetidos se rechazan. Un documento de otro emisor responde el mismo
                404 que uno inexistente. El estado y los datos devueltos son los persistidos, no una verificación fiscal actual.
            security:
            -   BearerAuth: []
            parameters:
            -   name: documento-id
                in: path
                required: true
                description: Identificador estable del documento de GOFIP; no es el CAE ni el ID de la fila factura.
                schema:
                    type: string
                    format: uuid
            responses:
                '200':
                    description: Factura fiscal persistida. No consulta ARCA ni regenera documentos.
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                                example: no-store
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RespuestaFacturaPersistida'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '404':
                    $ref: '#/components/responses/Error'
                '500':
                    $ref: '#/components/responses/Error'
    /api/v2/emisores/{id-emisor}/integraciones-sep:
      get:
        tags:
          - Integraciones SEP
        operationId: listarIntegracionesSEP
        summary: Lista Integraciones SEP
        description: "Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. "
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: limit
            in: query
            description: Tamaño inicial; no combinar con cursor.
            schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 20
          - name: cursor
            in: query
            description: Cursor firmado ligado al usuario, emisor y padre. Enviar sólo cursor al navegar.
            schema:
              type: string
        responses:
          "200":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/PaginaIntegracionesSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
      post:
        tags:
          - Integraciones SEP
        operationId: crearIntegracionSEP
        summary: Crea una Integración SEP
        description: "Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. Crea desactivada, sin permisos, y asocia automáticamente el emisor. No acepta IDs de ownership. Los bodies son estrictos; no aceptan emisor, usuario, cliente interno ni scopes. "
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuerpoCrearSEP"
        responses:
          "201":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/IntegracionSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
    /api/v2/emisores/{id-emisor}/integraciones-sep/{integracion-id}:
      get:
        tags:
          - Integraciones SEP
        operationId: obtenerIntegracionSEP
        summary: Obtiene una Integración SEP
        description: "Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. "
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
        responses:
          "200":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/IntegracionSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
      patch:
        tags:
          - Integraciones SEP
        operationId: actualizarIntegracionSEP
        summary: Actualiza una Integración SEP
        description: Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. Los bodies son estrictos; no aceptan emisor, usuario, cliente interno ni scopes. Se aplica a nuevas autenticaciones/autorizaciones. Las sesiones y capacidades ya emitidas conservan su vencimiento actual.
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuerpoActualizarSEP"
        responses:
          "200":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/IntegracionSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
    /api/v2/emisores/{id-emisor}/integraciones-sep/{integracion-id}/credenciales/{credencial-id}/permisos:
      put:
        tags:
          - Integraciones SEP
        operationId: actualizarPermisosCredencialSEP
        summary: Reemplaza los permisos de una credencial SEP
        description: Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. Los bodies son estrictos; no aceptan emisor, usuario, cliente interno ni scopes. Reemplaza exclusivamente los permisos de esa credencial, sin regenerar secreto ni alterar otras claves. Se aplica a nuevas capacidades. Las sesiones y capacidades ya emitidas conservan su vencimiento actual.
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
          - name: credencial-id
            in: path
            required: true
            description: Credencial concreta perteneciente a la integración autorizada.
            schema: {type: string, format: uuid}
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuerpoPermisosSEP"
        responses:
          "200":
            description: Operación SEP completada.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CredencialSEP"
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
    /api/v2/emisores/{id-emisor}/integraciones-sep/{integracion-id}/credenciales:
      get:
        tags:
          - Integraciones SEP
        operationId: listarCredencialesSEP
        summary: Lista credenciales de la integración
        description: "Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. "
        security:
          - CookieAuth: []
        parameters:
