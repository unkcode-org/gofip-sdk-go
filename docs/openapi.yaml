            required: [tributos]
            properties:
                tributos:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoTributo"
        RespuestaConceptos:
            type: object
            required: [conceptos]
            properties:
                conceptos:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoConcepto"
        RespuestaAlicuotas:
            type: object
            required: [alicuotas]
            properties:
                alicuotas:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoAlicuota"
        RespuestaTiposComprobante:
            type: object
            required: [tipos_comprobante]
            properties:
                tipos_comprobante:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoComprobanteARCA"
        RespuestaOpcionales:
            type: object
            required: [opcionales]
            properties:
                opcionales:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoOpcional"
        RespuestaTiposDocumento:
            type: object
            required: [tipos_documento]
            properties:
                tipos_documento:
                    type: array
                    items:
                        $ref: "#/components/schemas/TipoDocumentoARCA"
        RespuestaMonedas:
            type: object
            required: [monedas]
            properties:
                monedas:
                    type: array
                    items:
                        $ref: "#/components/schemas/Moneda"
        RespuestaCotizacionMoneda:
            type: object
            required: [cotizacion]
            properties:
                cotizacion:
                    $ref: "#/components/schemas/CotizacionMoneda"
        RespuestaPuntosVentaARCA:
            type: object
            required: [puntos_venta]
            properties:
                puntos_venta:
                    type: array
                    items:
                        $ref: "#/components/schemas/PuntoVentaARCA"

        SolicitudEmitirFactura:
            type: object
            description: Solicitud atómica para obtener el CAE y, opcionalmente, generar la representación de la factura.
            required: [factura]
            properties:
                factura:
                    $ref: "#/components/schemas/Comprobante"
                metadatos:
                    $ref: "#/components/schemas/MetadatosComprobante"
                tamano_papel:
                    type: string
                    description: Formato de la representación cuando se envía `metadatos`; `a4` es el valor predeterminado y genera PDF, `80mm` genera HTML.
                    enum: [a4, 80mm]
                    default: a4
        SolicitudEmitirFacturaWeb:
            type: object
            description: >-
                Solicitud de emisión desde el panel. Con `cliente_id`, los datos guardados completan
                los campos fiscales y los metadatos omitidos; todo valor enviado explícitamente
                prevalece y actualiza la ficha antes de invocar ARCA. Las dos condiciones fiscales,
                cuando se envían, deben coincidir. También se genera siempre PDF o HTML y, si falta
                `metodo_pago`, se usa Otro (8). Sin `cliente_id` se conserva el contrato anterior:
                un receptor completo e identificable se crea o actualiza automáticamente, mientras
                que un receptor anónimo 99/0 o una solicitud sin metadatos no se guarda.
            required: [factura]
            properties:
                cliente_id:
                    type: string
                    format: uuid
                    description: UUIDv7 opcional de una ficha activa perteneciente al emisor del punto de venta.
                factura:
                    $ref: "#/components/schemas/ComprobanteWeb"
                metadatos:
                    $ref: "#/components/schemas/MetadatosComprobanteWeb"
                tamano_papel:
                    type: string
                    description: Formato de la representación; `a4` genera PDF y `80mm` HTML. Con cliente se genera aun cuando este campo y `metadatos` se omitan.
                    enum: [a4, 80mm]
                    default: a4
        SolicitudGenerarPDFFactura:
            type: object
            description: Datos para crear una nueva representación de una factura autorizada y persistida.
            required: [metadatos]
            properties:
                metadatos:
                    $ref: "#/components/schemas/MetadatosComprobante"
                tamano_papel:
                    type: string
                    description: Formato de salida; `a4` es el valor predeterminado y genera PDF, `80mm` genera HTML.
                    enum: [a4, 80mm]
                    default: a4
        RespuestaEmitirFactura:
            type: object
            required: [factura]
            properties:
                documento_id:
                    type: string
                factura:
                    $ref: "#/components/schemas/ComprobanteAutorizado"
                pdf_url:
                    type: string
                    format: uri
                pdf_content_type:
                    type: string
        RespuestaEmitirFacturaWeb:
            description: Resultado de la emisión desde el panel con el vínculo opcional a la agenda del emisor.
            allOf:
                - $ref: "#/components/schemas/RespuestaEmitirFactura"
                - type: object
                  properties:
                      cliente_id:
                          type: string
                          format: uuid
                          description: Cliente vinculado al documento cuando fue seleccionado o guardado automáticamente; se omite para receptores no guardados.
        RespuestaPDFFactura:
            type: object
            required: [documento_id, pdf_url]
            properties:
                documento_id:
                    type: string
                pdf_url:
                    type: string
                    format: uri
                pdf_content_type:
                    type: string
        PaginaFacturas:
            type: object
            required: [data, paging]
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResumenFacturaDocumento"
                paging:
                    $ref: "#/components/schemas/MetadataCursor"
        MetadataCursor:
            type: object
            required: [limit, total, has_more]
            properties:
                limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                total:
                    type: integer
                    format: int64
                    minimum: 0
                has_more:
                    type: boolean
                next_cursor:
                    type: string
                prev_cursor:
                    type: string
        ResumenFacturaDocumento:
            type: object
            required: [documento_id, estado, origen, pdf_disponible, factura, created_at, updated_at]
            properties:
                documento_id:
                    type: string
                    format: uuid
                estado:
                    type: string
                    enum: [pendiente, autorizado, error]
                origen:
                    type: string
                    enum: [api, web, recurrente, legacy_import]
                usuario_id:
                    type: string
                    format: uuid
                credencial_id:
                    type: string
                    format: uuid
                cliente_id:
                    type: string
                    format: uuid
                    description: Ficha de cliente vinculada durante la emisión web; se omite para documentos sin cliente guardado y para el flujo API key.
                external_reference:
                    type: string
                pdf_disponible:
                    type: boolean
                factura:
                    type: object
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/ResumenDatosFactura"
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        ResumenDatosFactura:
            type: object
            properties:
                cae:
                    type: string
                fecha_vencimiento_cae:
                    type: string
                fecha_comprobante:
                    type: string
                tipo_comprobante:
                    type: integer
                punto_venta:
                    type: integer
                numero_comprobante:
                    type: integer
                    format: int64
                tipo_documento:
                    type: integer
                numero_documento:
                    type: string
                moneda_id:
                    type: string
                importe_total:
                    type: number
                    format: double
        DetalleFacturaDocumento:
            type: object
            required: [documento_id, punto_venta_id, estado, origen, cantidad_intentos, pdf, factura, errores, created_at, updated_at]
            properties:
                documento_id:
                    type: string
                    format: uuid
                punto_venta_id:
                    type: string
                    format: uuid
                estado:
                    type: string
                    enum: [pendiente, autorizado, error]
                origen:
                    type: string
                    enum: [api, web, recurrente, legacy_import]
                usuario_id:
                    type: string
                    format: uuid
                credencial_id:
                    type: string
                    format: uuid
                cliente_id:
                    type: string
                    format: uuid
                    description: Ficha de cliente vinculada durante la emisión web; se omite para documentos sin cliente guardado y para el flujo API key.
                cliente:
                    description: Ficha actual completa del cliente vinculado; se omite cuando no existe `cliente_id`.
                    allOf:
                        - $ref: "#/components/schemas/Cliente"
                external_reference:
                    type: string
                cantidad_intentos:
                    type: integer
                    minimum: 1
                pdf:
                    $ref: "#/components/schemas/EstadoPDFFactura"
                factura:
                    description: Datos fiscales y comerciales persistidos desde el inicio del intento. En errores nuevos, CAE y vencimiento son vacíos y el número es cero porque no hubo autorización.
                    type: object
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/DatosFacturaCompleta"
                errores:
                    type: array
                    items:
                        $ref: "#/components/schemas/ErrorIntentoFactura"
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        EstadoPDFFactura:
            type: object
            required: [disponible]
            properties:
                disponible:
                    type: boolean
                content_type:
                    type: string
                generado_at:
                    type: string
                    format: date-time
                actualizado_at:
                    type: string
                    format: date-time
        ErrorIntentoFactura:
            type: object
            required: [numero_intento, tipo, mensaje, fecha]
            properties:
                numero_intento:
                    type: integer
                    minimum: 1
                tipo:
                    type: string
                    enum: [arca, sistema]
                mensaje:
                    type: string
                fecha:
                    type: string
                    format: date-time
        DatosFacturaCompleta:
            type: object
            required: [factura_id, items, comprobantes_asociados, alicuotas_iva, tributos]
            properties:
                historico:
                    $ref: "#/components/schemas/DatosFiscalesHistoricos"
                factura_id:
                    type: string
                    format: uuid
                cae:
                    type: string
                fecha_vencimiento_cae:
                    type: string
                fecha_comprobante:
                    type: string
                tipo_comprobante:
                    type: integer
                numero_comprobante:
                    type: integer
                    format: int64
                concepto:
                    type: integer
                punto_venta:
                    type: integer
                tipo_documento:
                    type: integer
                numero_documento:
                    type: string
                moneda_id:
                    type: string
                cotizacion:
                    type: number
                    format: double
                importe_total:
                    type: number
                    format: double
                importe_no_gravado:
                    type: number
                    format: double
                importe_neto:
                    type: number
                    format: double
                importe_exento:
                    type: number
                    format: double
                importe_tributos:
                    type: number
                    format: double
                importe_iva:
                    type: number
                    format: double
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ItemFacturaPersistida"
                servicio_detalle:
                    type: object
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/ServicioFacturaPersistido"
                comprobantes_asociados:
                    type: array
                    items:
                        $ref: "#/components/schemas/ComprobanteAsociadoPersistido"
                alicuotas_iva:
                    type: array
                    items:
                        $ref: "#/components/schemas/IVAFacturaPersistido"
                tributos:
                    type: array
                    items:
                        $ref: "#/components/schemas/TributoFacturaPersistido"
                created_at:
                    type: string
                    format: date-time
        ItemFacturaPersistida:
            type: object
            properties:
                id: { type: string, format: uuid }
                descripcion: { type: string }
                codigo_iva: { type: string }
                iva_exento: { type: boolean }
                iva_no_gravado: { type: boolean }
                precio: { type: number, format: double }
                cantidad: { type: number, format: double }
                subtotal: { type: number, format: double }
                monto_iva: { type: number, format: double }
                total: { type: number, format: double }
        ServicioFacturaPersistido:
            type: object
            properties:
                fecha_vencimiento_pago: { type: string }
                fecha_servicio_desde: { type: string }
                fecha_servicio_hasta: { type: string }
        ComprobanteAsociadoPersistido:
            type: object
            properties:
                tipo: { type: integer }
                punto_venta: { type: integer }
                numero: { type: integer }
                cuit: { type: string }
                fecha: { type: string }
        IVAFacturaPersistido:
            type: object
            properties:
                codigo_iva: { type: integer }
                base_imponible: { type: number, format: double }
                importe: { type: number, format: double }
        TributoFacturaPersistido:
            type: object
            properties:
                id: { type: integer }
                descripcion: { type: string }
                base_imponible: { type: number, format: double }
                alicuota: { type: number, format: double }
                importe: { type: number, format: double }
        SolicitudGenerarDocumentoNoFiscal:
            type: object
            description: Datos dinámicos de un documento no fiscal.
            required: [datos]
            properties:
                datos:
                    type: object
                    description: Objeto cuyo contrato exacto es el `schema_datos` publicado por `GET /api/v2/templates-oficiales` para el `slug` elegido.
                    additionalProperties: true
        TemplateOficial:
            type: object
            description: Última versión estable disponible de un template oficial de documento no fiscal.
            required: [slug, version, nombre, descripcion, autor, ultima_modificacion, schema_datos]
            properties:
                slug:
                    type: string
                    description: Identificador usado en la URL de generación.
                    example: recibo
                version:
                    type: string
                    description: Versión SemVer inmutable del template.
                    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
                    example: 1.0.0
                nombre:
                    type: string
                    description: Nombre visible del tipo de documento.
                    example: Recibo
                descripcion:
                    type: string
                    description: Propósito y alcance no fiscal del template.
                autor:
                    type: string
                    description: Autor responsable del template.
                ultima_modificacion:
                    type: string
                    format: date-time
                    description: Fecha y hora RFC 3339 de publicación de esta versión.
                schema_datos:
                    type: object
                    description: JSON Schema Draft 2020-12 completo que valida `data.datos` antes de generar el documento.
                    additionalProperties: true
        RespuestaTemplatesOficiales:
            type: object
            required: [templates]
            properties:
                templates:
                    type: array
                    items:
                        $ref: "#/components/schemas/TemplateOficial"
        RespuestaDocumentoNoFiscal:
            type: object
            required: [documento_id, template_slug, template_version, pdf_url, pdf_content_type, pdf_generated_at]
            properties:
                documento_id:
                    type: string
                template_slug:
                    type: string
                template_version:
                    type: string
                pdf_url:
                    type: string
                    format: uri
                pdf_content_type:
                    type: string
                pdf_generated_at:
                    type: string
                    format: date-time
        SolicitudDocumentoComprobante:
            type: object
            description: Datos necesarios para renderizar un comprobante ya autorizado; no autoriza ni modifica el comprobante en ARCA.
            required: [comprobante, metadatos, items]
            properties:
                comprobante:
                    $ref: "#/components/schemas/ComprobanteAutorizado"
                metadatos:
                    $ref: "#/components/schemas/MetadatosComprobante"
                items:
                    type: array
                    description: Renglones que se imprimen en el documento, en el orden recibido.
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ItemComprobante"
                tamano_papel:
                    type: string
                    description: Formato de salida; `a4` genera PDF y es el valor predeterminado, mientras que `80mm` genera HTML imprimible.
                    enum: [a4, 80mm]
                    default: a4
        MetadatosDocumento:
            type: object
            description: Datos del receptor que no forman parte de la respuesta fiscal de ARCA pero se imprimen en el documento.
            required: [condicion_fiscal_cliente]
            properties:
                condicion_fiscal_cliente:
                    type: integer
                    description: >-
                        Condición fiscal del receptor: 1 Responsable Monotributo, 2 Sujeto No
                        Categorizado, 3 Consumidor Final, 4 Proveedor del Exterior, 5 IVA Exento,
                        6 IVA Responsable Inscripto o 7 IVA Responsable No Inscripto.
                    minimum: 1
                    maximum: 7
                    example: 6
                telefono_cliente:
                    type: string
                    description: Teléfono que se imprime como dato informativo del receptor; puede omitirse.
                    example: "+54 351 555-0100"
                email_cliente:
                    type: string
                    description: Email que se imprime y, si el punto de venta tiene habilitado el envío, recibe el PDF A4; puede omitirse.
                    format: email
                    example: facturacion@cliente.example
                domicilio_cliente:
                    type: string
                    description: Domicilio que se imprime para el receptor; es obligatorio salvo cuando `condicion_fiscal_cliente` es 3 (Consumidor Final).
                    example: Av. Siempre Viva 742, Córdoba
                nombre_o_razon_social_cliente:
                    type: string
                    description: Nombre o razón social que se imprime para el receptor; es obligatorio salvo cuando `condicion_fiscal_cliente` es 3 (Consumidor Final).
                    example: Cliente Ejemplo S.A.
        MetadatosComprobante:
            description: Datos comerciales usados exclusivamente para completar la representación PDF o HTML del comprobante.
            allOf:
                - $ref: "#/components/schemas/MetadatosDocumento"
                - type: object
                  required: [metodo_pago]
                  properties:
                      metodo_pago:
                          type: integer
                          description: Medio de pago local; usar un `id` publicado por `GET /api/v2/medios-pago` (1 Contado, 2 Débito, 3 Crédito, 4 Cheque, 5 Cuenta corriente, 6 Ticket, 7 Transferencia, 8 Otro).
                          minimum: 1
                          maximum: 8
                          example: 7
                      total_oini:
                          type: number
                          format: double
                          description: Total de otros impuestos nacionales indirectos (OINI) que se muestra en el documento; si se omite vale 0.
                          default: 0
                          example: 0
                      alias_moneda:
                          type: string
                          description: Símbolo o etiqueta a imprimir para una moneda extranjera no catalogada; en ese caso es obligatorio y el comprobante debe incluir una cotización positiva.
                          example: US$

        MetadatosComprobanteWeb:
            type: object
            description: >-
                Datos comerciales opcionales de la emisión web. Con `cliente_id`, los campos
                omitidos se completan desde la ficha; una cadena vacía explícita limpia teléfono o
                email. Sin `cliente_id`, conserva las reglas de `MetadatosComprobante` para generar
                una representación y guardar automáticamente un receptor identificable.
            properties:
                condicion_fiscal_cliente:
                    type: integer
                    minimum: 1
                    maximum: 7
                    description: Condición fiscal del receptor; si también se envía `factura.condicion_fiscal`, ambos valores deben coincidir.
                telefono_cliente:
                    type: string
                    description: Teléfono del receptor; con cliente, una cadena vacía explícita limpia el valor guardado.
                email_cliente:
                    type: string
                    description: Email válido del receptor; con cliente, una cadena vacía explícita limpia el valor guardado.
                domicilio_cliente:
                    type: string
                    description: Domicilio del receptor; vacío sólo es válido para Consumidor Final.
                nombre_o_razon_social_cliente:
                    type: string
                    description: Nombre o razón social del receptor; vacío sólo es válido para Consumidor Final.
                metodo_pago:
                    type: integer
                    minimum: 1
                    maximum: 8
                    description: Medio de pago local; con cliente, si se omite se materializa Otro (8).
                total_oini:
                    type: number
                    format: double
                    description: Total de otros impuestos nacionales indirectos; si se omite vale 0.
                    default: 0
                alias_moneda:
                    type: string
                    description: Símbolo o etiqueta para una moneda extranjera no catalogada.

        Comprobante:
            description: Datos comerciales y fiscales que la API valida, totaliza y envía a WSFE para solicitar un CAE.
            allOf:
                - $ref: "#/components/schemas/ComprobanteBase"
                - type: object
                  required: [tipo_documento, numero_documento, condicion_fiscal]
        ComprobanteWeb:
            description: >-
                Datos comerciales y fiscales para la emisión web. Con `cliente_id`, tipo, número y
                condición fiscal pueden omitirse y se completan desde la ficha; sin él conservan
                las reglas del comprobante API.
            allOf:
                - $ref: "#/components/schemas/ComprobanteBase"
        ComprobanteBase:
            type: object
            description: Propiedades comunes del comprobante electrónico enviado a WSFE.
            required: [tipo_comprobante, concepto, detalles]
            properties:
                tipo_comprobante:
                    type: integer
                    description: Tipo de factura admitido por esta API; 1 Factura A, 6 Factura B, 11 Factura C, 51 Factura M o 49 comprobante tipo 49.
                    enum: [1, 6, 11, 49, 51]
                concepto:
                    type: integer
                    description: Concepto WSFE; 1 productos, 2 servicios o 3 productos y servicios.
                    enum: [1, 2, 3]
                tipo_documento:
                    type: integer
                    description: ID de tipo de documento del receptor publicado por `GET /api/v2/arca/tipos-documento`; debe ser positivo.
                    minimum: 1
                numero_documento:
                    type: integer
                    format: int64
                    description: Número de documento del receptor; debe ser positivo salvo cuando `tipo_documento` es 99.
                condicion_fiscal:
                    type: integer
                    description: Condición fiscal del receptor; usa los identificadores 1 a 7 documentados en `MetadatosDocumento.condicion_fiscal_cliente`.
                    minimum: 1
                    maximum: 7
                fecha_comprobante:
                    type: string
                    nullable: true
                    description: Fecha de emisión en formato `AAAAMMDD`; si se omite WSFE recibe la fecha actual del servidor.
                    pattern: "^[0-9]{8}$"
                    example: "20260801"
                moneda_id:
                    type: string
                    nullable: true
                    description: Código publicado por `GET /api/v2/arca/monedas`; si se omite se usa `PES`.
                    default: PES
                cotizacion:
                    type: number
                    format: double
                    nullable: true
                    description: Cotización de la moneda; si se omite se usa 1. Para moneda extranjera debe corresponder al valor aceptado por ARCA.
                    default: 1
                fecha_servicio_desde:
                    type: string
                    nullable: true
                    description: Inicio del servicio en formato `AAAAMMDD`; sólo se usa para conceptos 2 o 3 y, si se omite, se envía la fecha actual.
                    pattern: "^[0-9]{8}$"
                fecha_servicio_hasta:
                    type: string
                    nullable: true
                    description: Fin del servicio en formato `AAAAMMDD`; sólo se usa para conceptos 2 o 3 y, si se omite, se envía la fecha actual.
                    pattern: "^[0-9]{8}$"
                fecha_vencimiento_pago:
                    type: string
                    nullable: true
                    description: Vencimiento de pago en formato `AAAAMMDD`; es obligatorio cuando `concepto` es 2 o 3.
                    pattern: "^[0-9]{8}$"
                cancela_misma_moneda:
                    type: string
                    nullable: true
                    description: Para una moneda distinta de `PES` es obligatorio indicar `S` si se cancela en la misma moneda o `N` en caso contrario.
                    enum: [S, "N"]
                detalles:
                    type: array
                    description: Ítems a facturar; la API calcula los totales fiscales a partir de estos renglones.
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ItemComprobante"
                comprobantes_asociados:
                    type: array
                    description: Comprobantes vinculados, usados por ejemplo para notas de crédito o débito.
                    items:
                        $ref: "#/components/schemas/ComprobanteAsociado"
                tributos:
                    type: array
                    description: Tributos adicionales cuyos importes se suman al total; los IDs válidos se publican en `GET /api/v2/arca/tributos`.
                    items:
                        $ref: "#/components/schemas/TributoComprobante"
                opcionales:
                    type: array
                    description: Datos opcionales de WSFE; los IDs válidos se publican en `GET /api/v2/arca/opcionales`.
                    items:
                        $ref: "#/components/schemas/OpcionalComprobante"
                compradores:
                    type: array
                    description: Receptores adicionales y su participación porcentual.
                    items:
                        $ref: "#/components/schemas/CompradorComprobante"
                consolidar_items:
                    type: boolean
                    nullable: true
                    description: Si es `true`, suma cantidad y subtotal de renglones con el mismo `id`; sus demás atributos deben coincidir.
                    default: false
        ItemComprobante:
            type: object
            description: Renglón comercial del comprobante; `subtotal` debe ser `precio_unitario × cantidad` redondeado a dos decimales.
            required: [id, descripcion, precio_unitario, cantidad, alicuotas_iva, subtotal]
            properties:
                id:
                    type: string
                    description: Código del producto o servicio asignado por el cliente.
                    example: SKU-001
                descripcion:
                    type: string
                    description: Texto del producto o servicio que se imprime en el documento.
                    example: Servicio mensual
                precio_unitario:
                    type: number
                    format: double
                    description: Precio neto unitario antes de IVA.
                    example: 100
                cantidad:
                    type: number
                    format: double
                    description: Cantidad facturada; debe ser mayor que cero.
                    exclusiveMinimum: true
                    minimum: 0
                    example: 1
                alicuotas_iva:
                    type: string
                    description: ID de alícuota de WSFE expresado como texto; puede obtenerse de `GET /api/v2/arca/alicuotas` (por ejemplo `5` representa 21%).
                    example: "5"
                iva_exento:
                    type: boolean
                    nullable: true
                    description: Cuando es `true`, suma el subtotal al importe exento; no puede ser `true` junto con `no_gravadode_iva`.
                no_gravadode_iva:
                    type: boolean
                    nullable: true
                    description: Cuando es `true`, suma el subtotal al importe no gravado; no puede ser `true` junto con `iva_exento`.
                subtotal:
                    type: number
                    format: double
                    description: Resultado de `precio_unitario × cantidad`, redondeado a dos decimales.
                    example: 100
                monto_iva:
                    type: number
                    format: double
                    description: Importe de IVA calculado; es informativo en entradas y la API lo recalcula para la representación.
                    readOnly: true
                total_con_iva:
                    type: number
                    format: double
                    description: Subtotal más IVA calculado; es informativo en entradas y la API lo recalcula.
                    readOnly: true
                precio_con_iva:
                    type: number
                    format: double
                    description: Precio unitario con IVA calculado; es informativo en entradas y la API lo recalcula.
                    readOnly: true
        IVAComprobante:
            type: object
            description: Total de IVA para una alícuota incluida en un comprobante autorizado.
            required: [id, base_imponible, importe]
            properties:
                id:
                    type: integer
                    description: ID de alícuota WSFE.
                base_imponible:
                    type: number
                    format: double
                    description: Base neta sobre la que se calculó la alícuota.
                importe:
                    type: number
                    format: double
                    description: Importe de IVA calculado para la base.
        TributoComprobante:
            type: object
            description: Tributo adicional incluido en la solicitud o respuesta fiscal.
            required: [id, descripcion, base_imponible, alicuota, importe]
            properties:
                id:
                    type: integer
                    description: ID publicado por `GET /api/v2/arca/tributos`.
                descripcion:
                    type: string
                    description: Nombre del tributo informado a WSFE.
                base_imponible:
                    type: number
                    format: double
                    description: Base sobre la que se aplica el tributo.
                alicuota:
                    type: number
                    format: double
                    description: Porcentaje aplicado a la base imponible.
                importe:
                    type: number
                    format: double
                    description: Importe calculado del tributo; se suma al total del comprobante.
        OpcionalComprobante:
            type: object
            description: Dato opcional definido por WSFE.
            required: [id, valor]
            properties:
                id:
                    type: integer
                    description: ID publicado por `GET /api/v2/arca/opcionales`.
                valor:
                    type: number
                    format: double
                    description: Valor numérico enviado para el opcional.
        CompradorComprobante:
            type: object
            description: Comprador adicional con su porcentaje de participación.
            required: [tipo_documento, numero_documento, porcentaje]
            properties:
                tipo_documento:
                    type: integer
                    description: ID de tipo de documento WSFE del comprador.
                numero_documento:
                    type: integer
                    format: int64
                    description: Número de documento del comprador.
                porcentaje:
                    type: number
                    format: double
                    description: Participación porcentual del comprador.
        ComprobanteAsociado:
            type: object
            description: Identificación fiscal de un comprobante vinculado.
            required: [numero, tipo, cuit, punto_venta]
            properties:
                numero:
                    type: integer
                    description: Número del comprobante asociado.
                tipo:
                    type: integer
                    description: Tipo WSFE del comprobante asociado.
                cuit:
                    type: integer
                    format: int64
                    description: CUIT del emisor del comprobante asociado, expresado sin guiones.
                punto_venta:
                    type: integer
                    description: Punto de venta fiscal del comprobante asociado.
        ActividadComprobante:
            type: object
            description: Actividad económica asociada por ARCA al comprobante.
            required: [id]
            properties:
                id:
                    type: integer
                    format: int64
                    description: ID de actividad ARCA.
        PeriodoComprobante:
            type: object
            description: Período asociado a un comprobante.
            required: [fecha_desde, fecha_hasta]
            properties:
                fecha_desde:
                    type: string
                    description: Inicio del período en formato `AAAAMMDD`.
                    pattern: "^[0-9]{8}$"
                fecha_hasta:
                    type: string
                    description: Fin del período en formato `AAAAMMDD`.
                    pattern: "^[0-9]{8}$"
        ObservacionComprobante:
            type: object
            properties:
                codigo:
                    type: integer
                mensaje:
                    type: string
        ComprobanteAutorizado:
            type: object
            description: Comprobante con CAE autorizado; para renderizarlo se envían los mismos campos devueltos por la operación de emisión.
            required:
                - cae
                - fecha_vencimiento_cae
                - fecha_comprobante
                - tipo_comprobante
                - punto_venta
                - numero_comprobante
                - concepto
                - tipo_documento
                - numero_documento
                - moneda_id
                - cotizacion
                - importe_total
                - importe_no_gravado
                - importe_neto
                - importe_exento
                - importe_tributos
                - importe_iva
            properties:
                cae:
                    type: string
                    description: Código de Autorización Electrónico otorgado por ARCA.
                    pattern: "^[0-9]{14}$"
                    example: "70479999806707"
                fecha_vencimiento_cae:
                    type: string
                    description: Fecha de vencimiento del CAE en formato `AAAAMMDD` o `AAAA-MM-DD`.
                    pattern: "^(?:[0-9]{8}|[0-9]{4}-[0-9]{2}-[0-9]{2})$"
                    example: "20260810"
                fecha_comprobante:
                    type: string
                    description: Fecha de emisión del comprobante en formato `AAAAMMDD` o `AAAA-MM-DD`.
                    pattern: "^(?:[0-9]{8}|[0-9]{4}-[0-9]{2}-[0-9]{2})$"
                    example: "20260801"
                tipo_comprobante:
                    type: integer
                    description: Código de tipo de comprobante WSFE autorizado.
                    example: 1
                punto_venta:
                    type: integer
                    description: Número de punto de venta fiscal usado para la autorización.
                    example: 4
                numero_comprobante:
                    type: integer
                    format: int64
                    description: Número correlativo del comprobante autorizado.
                    example: 125
                concepto:
                    type: integer
                    description: Concepto WSFE; 1 productos, 2 servicios o 3 productos y servicios.
                    enum: [1, 2, 3]
                tipo_documento:
                    type: integer
                    description: Código WSFE del tipo de documento del receptor.
                    example: 80
                numero_documento:
                    type: integer
                    format: int64
                    description: Número de documento del receptor; puede ser 0 cuando el tipo de documento es 99.
                    example: 20123456789
                moneda_id:
                    type: string
                    description: Código de moneda WSFE; `PES` representa pesos argentinos.
                    example: PES
                cotizacion:
                    type: number
                    format: double
                    description: Cotización aplicada a la moneda; para `PES` normalmente es 1.
                    example: 1
                importe_total:
                    type: number
                    format: double
                    description: Importe total autorizado, incluidos IVA y tributos.
                    example: 121
                importe_no_gravado:
                    type: number
                    format: double
                    description: Total de conceptos no gravados por IVA.
                    example: 0
                importe_neto:
                    type: number
                    format: double
                    description: Importe neto gravado.
                    example: 100
                importe_exento:
                    type: number
                    format: double
                    description: Total de conceptos exentos de IVA.
                    example: 0
                importe_tributos:
                    type: number
                    format: double
                    description: Total de tributos distintos del IVA.
                    example: 0
                importe_iva:
                    type: number
                    format: double
                    description: Importe total de IVA.
                    example: 21
                fecha_vencimiento_pago:
                    type: string
                    nullable: true
                    description: Fecha de vencimiento de pago en formato `AAAAMMDD`; corresponde a conceptos 2 o 3.
                    pattern: "^[0-9]{8}$"
                fecha_servicio_desde:
                    type: string
                    nullable: true
                    description: Inicio del período de servicio en formato `AAAAMMDD`; corresponde a conceptos 2 o 3.
                    pattern: "^[0-9]{8}$"
                fecha_servicio_hasta:
                    type: string
                    nullable: true
                    description: Fin del período de servicio en formato `AAAAMMDD`; corresponde a conceptos 2 o 3.
                    pattern: "^[0-9]{8}$"
                alicuotas_iva:
                    type: array
                    description: Desglose de IVA autorizado por ARCA.
                    items:
                        $ref: "#/components/schemas/IVAComprobante"
                periodo:
                    description: Período asociado informado por ARCA, cuando corresponde.
                    allOf:
                        - $ref: "#/components/schemas/PeriodoComprobante"
                tributos:
                    type: array
                    description: Tributos incluidos en el comprobante autorizado.
                    items:
                        $ref: "#/components/schemas/TributoComprobante"
                comprobantes_asociados:
                    type: array
                    description: Comprobantes asociados informados en la autorización.
                    items:
                        $ref: "#/components/schemas/ComprobanteAsociado"
                opcionales:
                    type: array
                    description: Datos opcionales de WSFE incluidos en el comprobante.
                    items:
                        $ref: "#/components/schemas/OpcionalComprobante"
                compradores:
                    type: array
                    description: Compradores adicionales y su participación porcentual.
                    items:
                        $ref: "#/components/schemas/CompradorComprobante"
                actividades:
                    type: array
                    description: Actividades económicas asociadas al comprobante.
                    items:
                        $ref: "#/components/schemas/ActividadComprobante"
