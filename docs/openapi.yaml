        CuerpoSolicitudCrearEmisor:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudCrearEmisor"
        CuerpoSolicitudActualizarEmisor:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudActualizarEmisor"
        SolicitudCrearEmisor:
            type: object
            description: Identidad fiscal que se asociará al usuario autenticado.
            required: [cuit, fecha_inicio_actividad, razon_social, domicilio_fiscal, condicion_fiscal]
            properties:
                cuit:
                    type: string
                    description: CUIT de once dígitos sin guiones; no puede repetirse para el mismo usuario.
                    pattern: "^[0-9]{11}$"
                    example: "20123456789"
                fecha_inicio_actividad:
                    type: string
                    description: Fecha de inicio de actividad en formato DD/MM/AAAA. No puede ser futura.
                    pattern: "^[0-9]{2}/[0-9]{2}/[0-9]{4}$"
                    example: "01/01/2020"
                razon_social:
                    type: string
                    description: Razón social registrada del emisor.
                    example: Empresa Ejemplo S.A.
                domicilio_fiscal:
                    type: string
                    description: Domicilio fiscal completo del emisor.
                    example: Av. Siempre Viva 742, Córdoba
                condicion_fiscal:
                    type: integer
                    description: Condición fiscal local; usa los mismos identificadores 1 a 7 documentados en `MetadatosDocumento.condicion_fiscal_cliente`.
                    minimum: 1
                    maximum: 7
                    example: 6
        SolicitudActualizarEmisor:
            type: object
            description: Datos fiscales editables que reemplazan los valores actuales del emisor.
            required: [fecha_inicio_actividad, razon_social, domicilio_fiscal, condicion_fiscal]
            properties:
                fecha_inicio_actividad:
                    type: string
                    description: Fecha de inicio de actividad en formato DD/MM/AAAA. No puede ser futura.
                    pattern: "^[0-9]{2}/[0-9]{2}/[0-9]{4}$"
                    example: "01/01/2020"
                razon_social:
                    type: string
                    description: Nueva razón social registrada del emisor.
                    example: Empresa Ejemplo S.A.
                domicilio_fiscal:
                    type: string
                    description: Nuevo domicilio fiscal completo del emisor.
                    example: Av. Siempre Viva 742, Córdoba
                condicion_fiscal:
                    type: integer
                    description: Condición fiscal local; usa los identificadores 1 a 7 documentados en `MetadatosDocumento.condicion_fiscal_cliente`.
                    minimum: 1
                    maximum: 7
                    example: 6
        RespuestaEmisores:
            type: object
            required: [emisores]
            properties:
                emisores:
                    type: array
                    items:
                        $ref: "#/components/schemas/Emisor"
        RespuestaCrearEmisor:
            type: object
            required: [id_emisor]
            properties:
                id_emisor:
                    type: string
        Emisor:
            type: object
            required: [setup_finalizado]
            properties:
                id:
                    type: string
                id_usuario:
                    type: string
                cuit:
                    type: string
                    pattern: "^[0-9]{11}$"
                fecha_inicio_actividad:
                    type: string
                razon_social:
                    type: string
                domicilio_fiscal:
                    type: string
                condicion_fiscal:
                    type: string
                setup_finalizado:
                    type: boolean
                    readOnly: true
                    description: Indica si el emisor tiene al menos un punto de venta registrado, independientemente de su estado.
                puntos_venta:
                    type: array
                    nullable: true
                    items:
                        $ref: "#/components/schemas/PuntoVenta"
        Cliente:
            type: object
            description: Ficha fiscal y de contacto de un receptor perteneciente a un emisor.
            required:
                [
                    cliente_id,
                    emisor_id,
                    tipo_documento,
                    numero_documento,
                    condicion_fiscal,
                    nombre_o_razon_social,
                    domicilio,
                    telefono,
                    email,
                    created_at,
                    updated_at,
                ]
            properties:
                cliente_id:
                    type: string
                    format: uuid
                    description: UUIDv7 estable de la ficha del cliente.
                emisor_id:
                    type: string
                    format: uuid
                    description: Emisor propietario de la agenda y de esta ficha.
                tipo_documento:
                    type: integer
                    minimum: 1
                    description: ID de tipo de documento del receptor publicado por `GET /api/v2/arca/tipos-documento`.
                numero_documento:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Número positivo que, junto con el tipo de documento, identifica al cliente dentro del emisor.
                condicion_fiscal:
                    type: integer
                    minimum: 1
                    maximum: 7
                    description: Condición fiscal del receptor según los identificadores 1 a 7 de `MetadatosDocumento.condicion_fiscal_cliente`.
                nombre_o_razon_social:
                    type: string
                    maxLength: 255
                    description: Nombre o razón social; puede estar vacío únicamente para Consumidor Final.
                domicilio:
                    type: string
                    maxLength: 255
                    description: Domicilio fiscal o comercial; puede estar vacío únicamente para Consumidor Final.
                telefono:
                    type: string
                    maxLength: 50
                    description: Teléfono opcional; una cadena vacía representa que no está informado.
                email:
                    type: string
                    maxLength: 191
                    description: Email válido opcional, normalizado a minúsculas; una cadena vacía representa que no está informado.
                created_at:
                    type: string
                    format: date-time
                    description: Fecha de creación original de la ficha.
                updated_at:
                    type: string
                    format: date-time
                    description: Fecha de su última modificación o restauración.
        SolicitudCrearCliente:
            type: object
            description: Datos de una ficha nueva; nombre y domicilio son obligatorios salvo para Consumidor Final.
            required: [tipo_documento, numero_documento, condicion_fiscal]
            properties:
                tipo_documento:
                    type: integer
                    minimum: 1
                    description: Tipo de documento positivo del receptor.
                numero_documento:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Número de documento positivo del receptor.
                condicion_fiscal:
                    type: integer
                    minimum: 1
                    maximum: 7
                    description: Condición fiscal del receptor; 3 corresponde a Consumidor Final.
                nombre_o_razon_social:
                    type: string
                    maxLength: 255
                    description: Nombre o razón social obligatorio salvo cuando la condición fiscal es 3.
                domicilio:
                    type: string
                    maxLength: 255
                    description: Domicilio obligatorio salvo cuando la condición fiscal es 3.
                telefono:
                    type: string
                    maxLength: 50
                    description: Teléfono opcional del receptor.
                email:
                    type: string
                    format: email
                    maxLength: 191
                    description: Email opcional del receptor; cuando se informa debe ser válido.
        SolicitudActualizarCliente:
            type: object
            minProperties: 1
            description: Cambios parciales de la ficha; sólo se modifican las propiedades presentes.
            properties:
                tipo_documento:
                    type: integer
                    minimum: 1
                    description: Nuevo tipo de documento positivo del receptor.
                numero_documento:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Nuevo número de documento positivo del receptor.
                condicion_fiscal:
                    type: integer
                    minimum: 1
                    maximum: 7
                    description: Nueva condición fiscal del receptor; 3 corresponde a Consumidor Final.
                nombre_o_razon_social:
                    type: string
                    maxLength: 255
                    description: Nuevo nombre; vacío sólo resulta válido para Consumidor Final.
                domicilio:
                    type: string
                    maxLength: 255
                    description: Nuevo domicilio; vacío sólo resulta válido para Consumidor Final.
                telefono:
                    type: string
                    maxLength: 50
                    description: Nuevo teléfono; enviar una cadena vacía lo elimina de la ficha.
                email:
                    type: string
                    maxLength: 191
                    description: Nuevo email válido; enviar una cadena vacía lo elimina de la ficha.
        PaginaClientes:
            type: object
            description: Página keyset de clientes activos del emisor.
            required: [data, paging]
