            security: [{EmbeddedSessionAuth: []}]
            responses: {"200": {description: Estado ARCA, content: {application/json: {schema: {$ref: "#/components/schemas/EstadoConexionARCAEmbedded"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    /api/v2/embed/arca/delegaciones:
