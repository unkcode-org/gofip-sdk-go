            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {$ref: "#/components/parameters/IdSesionWhatsApp"}]
            requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CuerpoMensajeDocumentoWhatsApp"}}}}
            responses: {"201": {description: Documento aceptado, content: {application/json: {schema: {$ref: "#/components/schemas/ResultadoMensajeWhatsApp"}}}}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "501": {$ref: "#/components/responses/Error"}}

components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: API key de credencial enviada como Bearer token.
        CookieAuth:
            type: apiKey
            in: cookie
            name: jwt
            description: Cookie HTTP Only emitida por el panel web.
        EmbeddedSessionAuth:
            type: http
            scheme: EmbeddedSession
            description: "Capacidad opaca de sesión Embedded enviada exclusivamente como Authorization: EmbeddedSession gofip_embsess_…. El token CSRF continúa siendo una protección adicional para métodos inseguros y no una credencial de autenticación."
        BootstrapKey:
            type: apiKey
            in: header
            name: X-Bootstrap-Key
            description: Clave de inicialización ingresada por el operador.
        IntegrationKeyAuth:
            type: http
            scheme: IntegrationKey
            description: Credencial M2M `gofip_int_<public-id>_<secret>` enviada en `Authorization`; no acepta JWT, cookies, credenciales de facturación ni secretos ARCA.
    parameters:
        CSRFEmbedded:
            name: X-CSRF-Token
            in: header
            required: true
            description: Token HMAC ligado a la sesión Embedded, obtenido en el canje o mediante GET /api/v2/embed/session. Obligatorio en POST, PUT, PATCH y DELETE Embedded.
            schema:
                type: string
                pattern: '^gofip_embcsrf_v1_[A-Za-z0-9_-]{43}$'
        IdClienteEmbedded:
            name: cliente-id
            in: path
            required: true
            description: UUIDv7 de un cliente del emisor confiable de la sesión Embedded.
            schema: {type: string, format: uuid}
        IdPuntoVentaEmbedded:
            name: punto-venta-id
            in: path
            required: true
            description: UUID de un punto de venta del emisor confiable de la sesión Embedded.
            schema: {type: string, format: uuid}
        IdCredencialARCAEmbedded:
            name: credencial-id
            in: path
            required: true
            description: UUID de una credencial ARCA propia del emisor confiable de la sesión Embedded.
            schema: {type: string, format: uuid}
        IdFacturaRecurrenteEmbedded:
            name: factura-recurrente-id
            in: path
            required: true
            description: UUID de una configuración recurrente del emisor confiable de la sesión Embedded.
            schema: {type: string, format: uuid}
        IdEjecucionFacturaRecurrenteEmbedded:
            name: ejecucion-id
            in: path
            required: true
            description: UUID de una ejecución de la configuración recurrente indicada.
            schema: {type: string, format: uuid}
        IdSesionWhatsAppEmbedded:
            name: sesion-id
            in: path
            required: true
            description: Identificador opaco de una sesión OpenWA del emisor confiable de la sesión Embedded.
            schema: {type: string}
        NumeroWhatsAppEmbedded:
            name: numero
            in: path
            required: true
            description: Número internacional para verificar dentro de la sesión OpenWA indicada.
            schema: {type: string}
        IdClienteIntegracion:
            name: integration-client-id
            in: path
            required: true
            description: UUIDv7 del cliente de integración padre.
            schema: {type: string, format: uuid}
        IdCredencialIntegracion:
            name: credential-id
            in: path
            required: true
            description: UUIDv7 de una credencial M2M perteneciente al cliente de integración padre.
            schema: {type: string, format: uuid}
        IdSesionWhatsApp:
            name: sesion-id
            in: path
            required: true
            description: Identificador opaco de la sesión asignado por OpenWA.
            schema: {type: string}
        NumeroWhatsApp:
            name: numero
            in: path
            required: true
            description: Número internacional sin construir manualmente un identificador de chat.
            schema: {type: string}
        AmbienteARCA:
            name: X-ARCA-Ambiente
            in: header
            required: false
            description: Ambiente ARCA que recibe la consulta o transacción; si se omite se usa `produccion`.
            schema:
                type: string
                enum: [homologacion, produccion]
                default: produccion
        Token:
            name: token
            in: path
            required: true
            description: Token opaco recibido por email para verificar la cuenta o restablecer su contraseña.
            schema:
                type: string
        IdEmisor:
            name: id-emisor
            in: path
            required: true
            description: UUID del emisor.
            schema:
                type: string
                format: uuid
        IdCliente:
            name: cliente-id
            in: path
            required: true
            description: UUIDv7 de una ficha de cliente activa perteneciente al emisor.
            schema:
                type: string
                format: uuid
        IdPuntoVenta:
            name: punto-venta-id
            in: path
            required: true
            description: UUID del punto de venta local.
            schema:
                type: string
                format: uuid
        IdCredencial:
            name: credencial-id
            in: path
            required: true
            description: UUID de la credencial API.
            schema:
                type: string
                format: uuid
        IdFacturaRecurrente:
            name: factura-recurrente-id
            in: path
            required: true
            description: UUID de la programación recurrente.
            schema: {type: string, format: uuid}
        IdEjecucionFacturaRecurrente:
            name: ejecucion-id
            in: path
            required: true
            description: UUID de una ejecución mensual.
            schema: {type: string, format: uuid}
        IdAutorizacion:
            name: autorizacion-id
            in: path
            required: true
            description: UUID de la autorización de uso de una credencial.
            schema:
                type: string
                format: uuid
        DocumentoID:
            name: documento-id
            in: path
            required: true
            description: UUID del documento persistido.
            schema:
                type: string
                format: uuid
        CUIT:
            name: cuit
            in: path
            required: true
            description: CUIT de once dígitos sin guiones.
            schema:
                type: string
                pattern: "^[0-9]{11}$"
        PuntoVentaFiscal:
            name: punto-venta
            in: path
            required: true
            description: Número de punto de venta fiscal registrado en ARCA.
            schema:
                type: integer
                minimum: 1
        TipoComprobante:
            name: tipo-comprobante
            in: path
            required: true
            description: Código de tipo de comprobante WSFE.
            schema:
                type: integer
                minimum: 1
        NumeroComprobante:
            name: numero-comprobante
            in: path
            required: true
            description: Número correlativo del comprobante en el punto de venta.
            schema:
                type: integer
                format: int64
                minimum: 1
        IdMoneda:
            name: id-moneda
            in: path
            required: true
            description: Código de moneda publicado por `GET /api/v2/arca/monedas`.
            schema:
                type: string
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            description: Clave elegida por el cliente para hacer seguro un reintento; reutilizarla con un cuerpo distinto produce conflicto.
            schema:
                type: string
                maxLength: 120
        ExternalReference:
            name: X-External-Reference
            in: header
            required: false
            description: Identificador libre del documento en el sistema del cliente, almacenado para correlación.
            schema:
                type: string
                maxLength: 120
        LimiteCursor:
            name: limit
            in: query
            required: false
            description: Cantidad de resultados de la página keyset. Se conserva dentro del cursor firmado.
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 10
        LimiteClientes:
            name: limit
            in: query
            required: false
            description: Cantidad de clientes de la página keyset; el valor predeterminado es 20 y el máximo 100.
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
        CursorClientes:
            name: cursor
            in: query
            required: false
            description: Cursor opaco firmado devuelto como `next_cursor` o `prev_cursor`; no debe combinarse con `limit`.
            schema:
                type: string
        BusquedaClientes:
            name: q
            in: query
            required: false
            description: Texto parcial para buscar por nombre o razón social, número de documento, email o teléfono; debe reenviarse al navegar con cursor.
            schema:
                type: string
        CursorFacturas:
            name: cursor
            in: query
            required: false
            description: Cursor opaco firmado devuelto como `next_cursor` o `prev_cursor`; no debe combinarse con `limit`, `sort` ni filtros.
            schema:
                type: string
        OrdenFacturas:
            name: sort
            in: query
            required: false
            description: Orden keyset; sólo admite `created_at` y `documento_id`. El predeterminado es `created_at:desc,documento_id:desc`.
            schema:
                type: string
                default: created_at:desc,documento_id:desc
        EstadoFactura:
            name: estado
            in: query
            required: false
            description: Restringe el listado al estado fiscal local indicado.
            schema:
                type: string
                enum: [pendiente, autorizado, error]
        FechaDesdeFactura:
            name: fecha_desde
            in: query
            required: false
            description: Fecha inicial inclusiva interpretada en `America/Argentina/Buenos_Aires`.
            schema:
                type: string
                format: date
        FechaHastaFactura:
            name: fecha_hasta
            in: query
            required: false
            description: Fecha final inclusiva interpretada en `America/Argentina/Buenos_Aires`.
            schema:
                type: string
                format: date
    responses:
        Nulo:
            description: Operación exitosa sin cuerpo
            content:
                application/json:
                    schema:
                        type: object
                        nullable: true
                        example: null
        Error:
            description: Error de negocio, validación o infraestructura
            headers:
                X-Content-Type-Options:
                    description: Evita que el cliente interprete el cuerpo con un tipo MIME distinto de `application/json`.
                    schema:
                        type: string
                        enum: [nosniff]
                        example: nosniff
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/DetallesError"
        Archivo:
            description: >-
                Con `tamano_papel=a4` o ausente devuelve `application/pdf` y
                `Content-Disposition: attachment; filename=factura.pdf`. Con `tamano_papel=80mm`
                devuelve `text/html` y `Content-Disposition: inline; filename=factura-80mm.html`.
            headers:
                Content-Disposition:
                    description: Indica si el archivo se descarga como PDF o se muestra inline como HTML.
                    schema:
                        type: string
            content:
                application/pdf:
                    schema:
                        type: string
                        format: binary
                text/html:
                    schema:
                        type: string
    schemas:
        DecimalHistorico:
          type: string
          pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
          maxLength: 24
          description: Decimal exacto; no usar notación exponencial ni float para recalcular
            históricos.
        IVAHistorico:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
              description: id.
            base_imponible:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            importe:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
          required:
          - id
          - base_imponible
          - importe
          description: IVAHistorico.
        TributoHistorico:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
              description: id.
            descripcion:
              type: string
              description: descripcion.
              nullable: true
            base_imponible:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            alicuota:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            importe:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
          required:
          - id
          - base_imponible
          - alicuota
          - importe
          description: TributoHistorico.
        OpcionalHistorico:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              description: id.
            valor:
              type: string
              description: valor.
              nullable: true
          required:
          - id
          description: OpcionalHistorico.
        CompradorHistorico:
          type: object
          additionalProperties: false
          properties:
            tipo_documento:
              type: integer
              format: int64
              description: tipo documento.
            numero_documento:
              type: string
              description: numero documento.
            porcentaje:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
          required:
          - tipo_documento
          - numero_documento
          - porcentaje
          description: CompradorHistorico.
        AsociadoHistorico:
          type: object
          additionalProperties: false
          properties:
            tipo:
              type: integer
              format: int64
              description: tipo.
            punto_venta:
              type: integer
              format: int64
              description: punto venta.
            numero:
              type: integer
              format: int64
              description: numero.
            cuit:
              type: string
              description: cuit.
              nullable: true
            fecha:
              type: string
              description: fecha.
              nullable: true
          required:
          - tipo
          - punto_venta
          - numero
          description: AsociadoHistorico.
        ActividadHistorica:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
              description: id.
          required:
          - id
          description: ActividadHistorica.
        PeriodoHistorico:
          type: object
          additionalProperties: false
          properties:
            fecha_desde:
              type: string
              description: fecha desde.
            fecha_hasta:
              type: string
              description: fecha hasta.
          required:
          - fecha_desde
          - fecha_hasta
          description: PeriodoHistorico.
        ObservacionHistorica:
          type: object
          additionalProperties: false
          properties:
            codigo:
              type: integer
              format: int64
              description: codigo.
            mensaje:
              type: string
              description: mensaje.
              nullable: true
          required:
          - codigo
          description: ObservacionHistorica.
        DatosFiscalesHistoricos:
          type: object
          additionalProperties: false
          properties:
            resultado:
              type: string
              nullable: true
              description: resultado.
            tipo_emision:
              type: string
              nullable: true
              description: tipo emision.
            cae:
              type: string
              nullable: true
              description: cae.
            fecha_vencimiento_cae:
              type: string
              nullable: true
              description: fecha vencimiento cae.
            fecha_comprobante:
              type: string
              nullable: true
              description: fecha comprobante.
            numero_documento:
              type: string
              nullable: true
              description: numero documento.
            moneda_id:
              type: string
              nullable: true
              description: moneda id.
            fecha_servicio_desde:
              type: string
              nullable: true
              description: fecha servicio desde.
            fecha_servicio_hasta:
              type: string
              nullable: true
              description: fecha servicio hasta.
            fecha_vencimiento_pago:
              type: string
              nullable: true
              description: fecha vencimiento pago.
            fecha_proceso:
              type: string
              nullable: true
              description: fecha proceso.
            cancela_misma_moneda:
              type: string
              nullable: true
              description: cancela misma moneda.
            punto_venta:
              type: integer
              format: int64
              nullable: true
              description: punto venta.
            tipo_comprobante:
              type: integer
              format: int64
              nullable: true
              description: tipo comprobante.
            comprobante_desde:
              type: integer
              format: int64
              nullable: true
              description: comprobante desde.
            comprobante_hasta:
              type: integer
              format: int64
              nullable: true
              description: comprobante hasta.
            concepto:
              type: integer
              format: int64
              nullable: true
              description: concepto.
            tipo_documento:
              type: integer
              format: int64
              nullable: true
              description: tipo documento.
            condicion_iva_receptor:
              type: integer
              format: int64
              nullable: true
              description: Identificador ARCA histórico; no equivale a CondicionFiscal del
                catálogo interno GOFIP. Permanece ausente cuando ARCA no lo devuelve.
            cotizacion:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_total:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_neto:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_iva:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_exento:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_no_gravado:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            importe_tributos:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
              nullable: true
            alicuotas_iva:
              type: array
              items:
                $ref: '#/components/schemas/IVAHistorico'
              nullable: true
              description: alicuotas iva.
              maxItems: 1000
            tributos:
              type: array
              items:
                $ref: '#/components/schemas/TributoHistorico'
              nullable: true
              description: tributos.
              maxItems: 1000
            comprobantes_asociados:
              type: array
              items:
                $ref: '#/components/schemas/AsociadoHistorico'
              nullable: true
              description: comprobantes asociados.
              maxItems: 1000
            opcionales:
              type: array
              items:
                $ref: '#/components/schemas/OpcionalHistorico'
              nullable: true
              description: opcionales.
              maxItems: 1000
            compradores:
              type: array
              items:
                $ref: '#/components/schemas/CompradorHistorico'
              nullable: true
              description: compradores.
              maxItems: 1000
            actividades:
              type: array
              items:
                $ref: '#/components/schemas/ActividadHistorica'
              nullable: true
              description: actividades.
              maxItems: 1000
            observaciones:
              type: array
              items:
                $ref: '#/components/schemas/ObservacionHistorica'
              nullable: true
              description: observaciones.
              maxItems: 1000
            periodo_asociado:
              allOf:
              - $ref: '#/components/schemas/PeriodoHistorico'
              nullable: true
              description: Dato opcional, ausente cuando no consta.
          description: Campos presentes de la fuente fiscal. En el request son valores esperados
            que se comparan con ARCA; un campo ausente no equivale a cero/lista vacía. No
            se inventan datos. La respuesta conserva decimales y estructuras históricas.
        FacturaHistorica:
          type: object
          additionalProperties: false
          properties:
            punto_venta:
              type: integer
              minimum: 1
              maximum: 99999
              description: punto venta.
            tipo_comprobante:
              type: integer
              minimum: 1
              description: tipo comprobante.
            numero_comprobante:
              type: integer
              format: int64
              minimum: 1
              maximum: 99999999
              description: numero comprobante.
            cae:
              type: string
              pattern: ^[0-9]{1,20}$
              description: cae.
            datos_historicos:
              allOf:
              - $ref: '#/components/schemas/DatosFiscalesHistoricos'
              nullable: true
              description: Afirmaciones fiscales opcionales. Todos los valores aportados deben
                coincidir con la consulta ARCA. No completan silenciosamente campos ausentes
                en la fuente fiscal.
          required:
          - punto_venta
          - tipo_comprobante
          - numero_comprobante
          - cae
          description: FacturaHistorica.
        ProcedenciaFactura:
          type: object
          additionalProperties: false
          properties:
            sistema:
              type: string
              enum:
              - gofip_legacy
              description: sistema.
            registro_id:
              type: string
              maxLength: 120
              description: Identificador estable del registro en el sistema cliente. Es opcional;
                no se exige un invoice_id central Legacy inexistente.
          required:
          - sistema
          description: ProcedenciaFactura.
        ItemHistorico:
          type: object
          additionalProperties: false
          properties:
            referencia_original:
              type: string
              maxLength: 120
              description: referencia original.
            descripcion:
              type: string
              maxLength: 255
              description: descripcion.
            cantidad:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            precio_unitario:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            subtotal:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            monto_iva:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            total:
              type: string
              pattern: ^-?[0-9]{1,16}(\.[0-9]{1,6})?$
              maxLength: 24
              description: Decimal exacto; no usar notación exponencial ni float para recalcular
                históricos.
            codigo_iva:
              type: string
              description: codigo iva.
            iva_exento:
              type: boolean
              nullable: true
              description: iva exento.
            iva_no_gravado:
              type: boolean
              nullable: true
              description: iva no gravado.
          required:
          - descripcion
          - cantidad
          - precio_unitario
          - subtotal
          - monto_iva
          - total
