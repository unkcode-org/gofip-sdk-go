components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: API key de credencial enviada como Bearer token.
        CookieAuth:
            type: apiKey
            in: cookie
            name: jwt
            description: Cookie HTTP Only emitida por el panel web.
    parameters:
        AmbienteARCA:
            name: X-ARCA-Ambiente
            in: header
            required: false
            description: Ambiente ARCA a utilizar. Si se omite, se usa produccion.
            schema:
                type: string
                enum: [homologacion, produccion]
                default: produccion
        Token:
            name: token
            in: path
            required: true
            schema:
                type: string
        IdEmisor:
            name: id-emisor
            in: path
            required: true
            schema:
                type: string
        IdPuntoVenta:
            name: punto-venta-id
            in: path
            required: true
            schema:
                type: string
        IdCredencial:
            name: credencial-id
            in: path
            required: true
            schema:
                type: string
        IdAutorizacion:
            name: autorizacion-id
            in: path
            required: true
            schema:
                type: string
        DocumentoID:
            name: documento-id
            in: path
            required: true
            schema:
                type: string
        CUIT:
            name: cuit
            in: path
            required: true
            schema:
                type: string
                pattern: "^[0-9]{11}$"
        PuntoVentaFiscal:
            name: punto-venta
            in: path
            required: true
            schema:
                type: integer
        TipoComprobante:
            name: tipo-comprobante
            in: path
            required: true
            schema:
                type: integer
        NumeroComprobante:
            name: numero-comprobante
            in: path
            required: true
            schema:
                type: integer
                format: int64
        IdMoneda:
            name: id-moneda
            in: path
            required: true
            schema:
                type: string
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            schema:
                type: string
                maxLength: 120
        ExternalReference:
            name: X-External-Reference
            in: header
            required: false
            schema:
                type: string
                maxLength: 120
    responses:
        Nulo:
            description: Operación exitosa sin cuerpo
            content:
                application/json:
                    schema:
                        nullable: true
                        example: null
        Error:
            description: Error de negocio, validación o infraestructura
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/DetallesError"
        Archivo:
            description: Archivo PDF o HTML generado
            content:
                application/pdf:
                    schema:
                        type: string
                        format: binary
                text/html:
                    schema:
                        type: string
    schemas:
        DetallesError:
            type: object
            required: [title, status, detail]
            properties:
                code:
                    type: string
                type:
                    type: string
                    example: about:blank
                title:
                    type: string
                status:
                    type: integer
                detail:
                    type: string
                instance:
                    type: string
                request_id:
                    type: string
                    nullable: true

        CuerpoSolicitudIniciarSesion:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudIniciarSesion"
        CuerpoSolicitudRegistrarUsuario:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudRegistrarUsuario"
        CuerpoSolicitudRecuperarCuenta:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudRecuperarCuenta"
        CuerpoSolicitudRestablecerContrasena:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudRestablecerContrasena"
        CuerpoSolicitudPuntoVenta:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudPuntoVenta"
        CuerpoSolicitudCrearCredencial:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudCrearCredencial"
        CuerpoSolicitudCrearAutorizacionCredencial:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudCrearAutorizacionCredencial"
        CuerpoSolicitudActualizarAutorizacionCredencial:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudActualizarAutorizacionCredencial"
        CuerpoSolicitudDocumentoComprobante:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudDocumentoComprobante"
        CuerpoSolicitudEmitirFactura:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudEmitirFactura"
        CuerpoSolicitudGenerarPDFFactura:
            type: object
            required: [data]
            properties:
                data:
                    $ref: "#/components/schemas/SolicitudGenerarPDFFactura"

        SolicitudIniciarSesion:
            type: object
            required: [email, contrasena, mantener_sesion]
            properties:
                email:
                    type: string
                    format: email
                contrasena:
                    type: string
                    format: password
                mantener_sesion:
                    type: boolean
        SolicitudRegistrarUsuario:
            type: object
            required: [nombre, apellido, email, contrasena]
            properties:
                nombre:
                    type: string
                apellido:
                    type: string
                email:
                    type: string
                    format: email
                contrasena:
                    type: string
                    format: password
        SolicitudRecuperarCuenta:
            type: object
            required: [email]
            properties:
                email:
                    type: string
                    format: email
        SolicitudRestablecerContrasena:
            type: object
            required: [contrasena]
            properties:
                contrasena:
                    type: string
                    format: password
        RespuestaIniciarSesion:
            type: object
            required: [token_autenticacion]
            properties:
                token_autenticacion:
                    type: string
        RespuestaRegistrarUsuario:
            type: object
            required: [id_usuario]
            properties:
                id_usuario:
                    type: string

        MultipartCrearEmisor:
            type: object
            required: [data, certificado, clave_privada]
            properties:
                data:
                    type: string
                    description: JSON serializado con los campos de SolicitudCrearEmisor.
                    example: '{"cuit":"20123456789","fecha_inicio_actividad":"20200101","razon_social":"Empresa SA","domicilio_fiscal":"Calle 123","condicion_fiscal":6}'
                certificado:
                    type: string
                    format: binary
                clave_privada:
                    type: string
                    format: binary
        MultipartActualizarEmisor:
            type: object
            required: [data]
            properties:
                data:
                    type: string
                    description: JSON serializado con los campos de SolicitudActualizarEmisor.
                    example: '{"razon_social":"Empresa SA","domicilio_fiscal":"Calle 123","condicion_fiscal":6}'
                certificado:
                    type: string
                    format: binary
                clave_privada:
                    type: string
                    format: binary
        SolicitudCrearEmisor:
            type: object
            required: [cuit, fecha_inicio_actividad, razon_social, domicilio_fiscal, condicion_fiscal]
            properties:
                cuit:
                    type: string
                    pattern: "^[0-9]{11}$"
                fecha_inicio_actividad:
                    type: string
                razon_social:
                    type: string
                domicilio_fiscal:
                    type: string
                condicion_fiscal:
                    type: integer
        SolicitudActualizarEmisor:
            type: object
            required: [razon_social, domicilio_fiscal, condicion_fiscal]
            properties:
                razon_social:
                    type: string
                domicilio_fiscal:
                    type: string
                condicion_fiscal:
                    type: integer
        RespuestaEmisores:
            type: object
            required: [emisores]
            properties:
                emisores:
                    type: array
                    items:
                        $ref: "#/components/schemas/Emisor"
        RespuestaCrearEmisor:
            type: object
            required: [id_emisor]
            properties:
                id_emisor:
                    type: string
        Emisor:
            type: object
            properties:
                id:
                    type: string
                id_usuario:
                    type: string
                cuit:
                    type: string
                    pattern: "^[0-9]{11}$"
                fecha_inicio_actividad:
                    type: string
                razon_social:
                    type: string
                domicilio_fiscal:
                    type: string
                condicion_fiscal:
                    type: string
                aplicaciones:
                    type: array
                    nullable: true
                    items:
                        $ref: "#/components/schemas/Aplicacion"
                vencimiento_certificado:
                    type: string
                    format: date-time

        SolicitudPuntoVenta:
            type: object
            required: [nombre, nro_pto_vta_fiscal]
            properties:
                nombre:
                    type: string
                nro_pto_vta_fiscal:
                    type: integer
                estado:
                    type: string
                    enum: [activo, inactivo]
                logo_factura_url:
                    type: string
                img_fondo_factura_url:
                    type: string
                website_url:
                    type: string
                enviar_factura_mail:
                    type: boolean
                autorizacion_requerida:
                    type: boolean
        PuntoVenta:
            type: object
            properties:
                punto_venta_id:
                    type: string
                emisor_id:
                    type: string
                nombre:
                    type: string
                nro_pto_vta_fiscal:
                    type: integer
                estado:
                    type: string
                    enum: [activo, inactivo]
                logo_factura_url:
                    type: string
                img_fondo_factura_url:
                    type: string
                website_url:
                    type: string
                enviar_factura_mail:
                    type: boolean
                autorizacion_requerida:
                    type: boolean
                credenciales:
                    type: array
                    items:
                        $ref: "#/components/schemas/CredencialPuntoVenta"
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        RespuestaPuntosVentaEmisor:
            type: object
            required: [puntos_venta]
            properties:
                puntos_venta:
                    type: array
                    items:
                        $ref: "#/components/schemas/PuntoVenta"
        RespuestaCrearPuntoVenta:
            type: object
            required: [punto_venta_id]
            properties:
                punto_venta_id:
                    type: string

        SolicitudCrearCredencial:
            type: object
            required: [etiqueta]
            properties:
                etiqueta:
                    type: string
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
        RespuestaCrearCredencial:
            type: object
            required: [credencial_id, api_key, api_key_prefix]
            properties:
                credencial_id:
                    type: string
                api_key:
                    type: string
                api_key_prefix:
                    type: string
        RespuestaRegenerarCredencial:
            type: object
            required: [api_key]
            properties:
                api_key:
                    type: string
        CredencialPuntoVenta:
            type: object
            properties:
                credencial_id:
                    type: string
                punto_venta_id:
                    type: string
                api_key_prefix:
                    type: string
                etiqueta:
                    type: string
                activo:
                    type: boolean
                ultimo_uso_at:
                    type: string
                    format: date-time
                    nullable: true
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
                revoked_at:
                    type: string
                    format: date-time
                    nullable: true
                autorizaciones:
                    type: array
                    items:
                        $ref: "#/components/schemas/CredencialAutorizacionUso"
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        CredencialPuntoVentaResumen:
            type: object
            properties:
                credencial_id:
                    type: string
                etiqueta:
                    type: string
                api_key_prefix:
                    type: string
                activo:
                    type: boolean
                ultimo_uso_at:
                    type: string
                    format: date-time
                    nullable: true
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
                revoked_at:
                    type: string
                    format: date-time
                    nullable: true
        RespuestaCredencialesPuntoVenta:
            type: object
            required: [credenciales]
            properties:
                credenciales:
                    type: array
                    items:
                        $ref: "#/components/schemas/CredencialPuntoVentaResumen"
        TipoAutorizacion:
            type: object
            properties:
                tipo_autorizacion_id:
                    type: integer
                slug:
                    type: string
                etiqueta:
                    type: string
                regex:
                    type: string
        CredencialAutorizacionUso:
            type: object
            properties:
