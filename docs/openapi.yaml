    /api/v2/puntos-venta/{punto-venta-id}/facturas:
        get:
            tags: [Facturación web]
            operationId: listarFacturasPuntoVenta
            summary: Lista las facturas del punto de venta
            description: >-
                Consulta la persistencia local del punto de venta del usuario autenticado. Usa
                paginación keyset de Uker con cursores firmados y devuelve facturas emitidas por
                API o por la web, ordenadas por creación descendente. El cursor conserva límite,
                filtros y orden; no se admiten los parámetros anteriores `page` y `per_page`.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
                - $ref: "#/components/parameters/LimiteCursor"
                - $ref: "#/components/parameters/CursorFacturas"
                - $ref: "#/components/parameters/OrdenFacturas"
                - $ref: "#/components/parameters/EstadoFactura"
                - $ref: "#/components/parameters/FechaDesdeFactura"
                - $ref: "#/components/parameters/FechaHastaFactura"
            responses:
                "200":
                    description: Página de facturas y cursores de navegación
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaginaFacturas"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        post:
            tags: [Facturación web]
            operationId: emitirFacturaPuntoVenta
            summary: Emite una factura desde la sesión web
            description: >-
                Obtiene el token WSFE del emisor y reutiliza el flujo fiscal existente sin usar una
                credencial API. El documento queda atribuido con `origen=web`, el usuario actual y
                `credencial_id=null`. Un punto de venta inactivo no puede emitir. El payload
                materializado después de completar o actualizar el cliente participa del hash de
                idempotencia; reutilizar la clave con datos efectivos distintos responde 409.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
                - $ref: "#/components/parameters/AmbienteARCA"
                - $ref: "#/components/parameters/IdempotencyKey"
                - $ref: "#/components/parameters/ExternalReference"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CuerpoSolicitudEmitirFacturaWeb"
            responses:
                "200":
                    description: Factura autorizada; con cliente vinculado incluye siempre la representación generada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaEmitirFacturaWeb"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "409":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/puntos-venta/{punto-venta-id}/facturas/{documento-id}:
        get:
            tags: [Facturación web]
            operationId: obtenerDetalleFacturaPuntoVenta
            summary: Obtiene el detalle completo de una factura
            description: >-
                Devuelve atribución, intentos, datos fiscales, ítems, servicio, comprobantes
                asociados, IVA, tributos, estado del archivo y los errores técnicos cronológicos
                de una factura del punto de venta. Un documento ajeno o no fiscal responde 404.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
                - $ref: "#/components/parameters/DocumentoID"
            responses:
                "200":
                    description: Detalle completo de la factura
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DetalleFacturaDocumento"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/puntos-venta/{punto-venta-id}/facturas/{documento-id}/pdf:
        post:
            tags: [Facturación web]
            operationId: gestionarPDFFacturaPuntoVenta
            summary: Descarga, genera o regenera la representación de una factura
            description: >-
                Sin cuerpo o con `{}` devuelve una URL firmada si el archivo ya existe. Con
                `data.metadatos` genera la representación o reemplaza la existente. No se
                persisten los metadatos de renderizado y sólo se admiten facturas autorizadas.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
                - $ref: "#/components/parameters/DocumentoID"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/CuerpoSolicitudGenerarPDFFactura"
                                - type: object
                                  description: Objeto vacío para solicitar la URL de una representación ya almacenada.
                                  maxProperties: 0
            responses:
                "200":
                    description: URL firmada temporal de la representación
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaPDFFactura"
                "400":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes:
        get:
            tags: [Facturación recurrente]
            operationId: listarFacturasRecurrentes
            summary: Lista las facturas recurrentes del punto de venta
            description: Devuelve todas las programaciones del punto de venta, con su estado y próximos vencimientos.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}]
            responses:
                "200":
                    description: Programaciones, incluidas las pausadas y canceladas
                    content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/FacturaRecurrente"}}}}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
        post:
            tags: [Facturación recurrente]
            operationId: crearFacturaRecurrente
            summary: Programa una factura mensual para un cliente
            description: >-
                Guarda una plantilla editable y genera siempre una representación PDF A4. En cada
                ejecución usa los datos actuales del cliente. Cuando el día elegido no existe en
                el mes, utiliza su último día.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}]
            requestBody:
                required: true
                content: {application/json: {schema: {$ref: "#/components/schemas/CuerpoSolicitudFacturaRecurrente"}}}
            responses:
                "201": {description: Factura recurrente programada, content: {application/json: {schema: {$ref: "#/components/schemas/FacturaRecurrente"}}}}
                "400": {$ref: "#/components/responses/Error"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes/{factura-recurrente-id}:
        parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}, {$ref: "#/components/parameters/IdFacturaRecurrente"}]
        get:
            tags: [Facturación recurrente]
            operationId: obtenerFacturaRecurrente
            summary: Obtiene una factura recurrente
            description: Devuelve la plantilla, la programación mensual y sus canales de entrega.
            security: [{CookieAuth: []}]
            responses:
                "200": {description: Programación encontrada, content: {application/json: {schema: {$ref: "#/components/schemas/FacturaRecurrente"}}}}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
        patch:
            tags: [Facturación recurrente]
            operationId: actualizarFacturaRecurrente
            summary: Reemplaza la plantilla, programación y canales editables
            description: Reemplaza los datos editables y recalcula la próxima ejecución sin modificar el historial existente.
            security: [{CookieAuth: []}]
            requestBody:
                required: true
                content: {application/json: {schema: {$ref: "#/components/schemas/CuerpoSolicitudFacturaRecurrente"}}}
            responses:
                "200": {description: Programación actualizada, content: {application/json: {schema: {$ref: "#/components/schemas/FacturaRecurrente"}}}}
                "400": {$ref: "#/components/responses/Error"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
        delete:
            tags: [Facturación recurrente]
            operationId: cancelarFacturaRecurrente
            summary: Cancela definitivamente una factura recurrente
            description: Evita nuevas ejecuciones; el historial de comprobantes y entregas permanece disponible.
            security: [{CookieAuth: []}]
            responses:
                "204": {description: Programación cancelada}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes/{factura-recurrente-id}/pausar:
        post:
            tags: [Facturación recurrente]
            operationId: pausarFacturaRecurrente
            summary: Pausa futuras ejecuciones
            description: Suspende la creación de nuevas ocurrencias hasta que la programación sea reactivada.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}, {$ref: "#/components/parameters/IdFacturaRecurrente"}]
            responses:
                "204": {description: Programación pausada}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes/{factura-recurrente-id}/reactivar:
        post:
            tags: [Facturación recurrente]
            operationId: reactivarFacturaRecurrente
            summary: Reactiva una programación pausada desde su próxima fecha futura
            description: Reanuda la programación sin emitir las ocurrencias omitidas mientras estuvo pausada.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}, {$ref: "#/components/parameters/IdFacturaRecurrente"}]
            responses:
                "204": {description: Programación reactivada}
                "400": {$ref: "#/components/responses/Error"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes/{factura-recurrente-id}/ejecuciones:
        get:
            tags: [Facturación recurrente]
            operationId: listarEjecucionesFacturaRecurrente
            summary: Lista el historial de ejecuciones y entregas
            description: Devuelve las ejecuciones en orden descendente e incluye cada intento de entrega por email o WhatsApp.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}, {$ref: "#/components/parameters/IdFacturaRecurrente"}]
            responses:
                "200": {description: Historial cronológico descendente, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/EjecucionFacturaRecurrente"}}}}}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/puntos-venta/{punto-venta-id}/facturas-recurrentes/{factura-recurrente-id}/ejecuciones/{ejecucion-id}:
        get:
            tags: [Facturación recurrente]
            operationId: obtenerEjecucionFacturaRecurrente
            summary: Obtiene una ejecución con el estado de cada entrega
            description: Devuelve el documento generado, los reintentos de facturación y el resultado de cada canal.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdPuntoVenta"}, {$ref: "#/components/parameters/IdFacturaRecurrente"}, {$ref: "#/components/parameters/IdEjecucionFacturaRecurrente"}]
            responses:
                "200": {description: Ejecución encontrada, content: {application/json: {schema: {$ref: "#/components/schemas/EjecucionFacturaRecurrente"}}}}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/credenciales/{credencial-id}/regenerar:
        post:
            tags: [Credenciales]
