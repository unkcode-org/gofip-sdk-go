            description: Requiere `arca:read`; UUID de otro emisor es opaco.
            security: [{EmbeddedSessionAuth: []}]
            responses: {"200": {description: Metadata de credencial, content: {application/json: {schema: {$ref: "#/components/schemas/CredencialARCAEmbedded"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
        delete:
            tags: [API Embedded]
            operationId: eliminarCredencialARCAEmbedded
            parameters: [{$ref: "#/components/parameters/CSRFEmbedded"}]
            summary: Elimina credencial propia inactiva
            description: Requiere `arca:write`; UUID de otro emisor es opaco.
            security: [{EmbeddedSessionAuth: []}]
            responses: {"204": {description: Credencial eliminada}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
