                - $ref: "#/components/parameters/IdPuntoVenta"
            responses:
                "200":
                    description: Credenciales del punto de venta
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RespuestaCredencialesPuntoVenta"
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
                "500":
                    $ref: "#/components/responses/Error"
        post:
            tags: [Credenciales]
            operationId: crearCredencialPuntoVenta
            summary: Crea una credencial API para un punto de venta
            description: Crea una credencial Bearer; el valor `api_key` de la respuesta sólo se entrega en esta operación y debe almacenarse de forma segura.
            security:
                - CookieAuth: []
            parameters:
                - $ref: "#/components/parameters/IdPuntoVenta"
