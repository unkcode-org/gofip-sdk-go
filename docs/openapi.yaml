        operationId: revocarCredencialSEP
        summary: Revoca una credencial de integración
        description: Requiere CookieAuth y pertenencia obligatoria del emisor. Una integración o credencial fuera del padre responde 404. Sólo integraciones SEP pertenecientes directamente al emisor; los clientes globales no son accesibles. Se aplica a nuevas autenticaciones/autorizaciones. Las sesiones y capacidades ya emitidas conservan su vencimiento actual.
        security:
          - CookieAuth: []
        parameters:
          - name: id-emisor
            in: path
            required: true
            description: Emisor seleccionado cuya pertenencia se verifica contra la cookie.
            schema:
              type: string
              format: uuid
          - name: integracion-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
          - name: credencial-id
            in: path
            required: true
            description: Recurso perteneciente exclusivamente al padre autorizado.
            schema:
              type: string
              format: uuid
        responses:
          "204":
            description: Credencial revocada.
          "400":
            $ref: "#/components/responses/Error"
          "401":
            $ref: "#/components/responses/Error"
          "403":
            $ref: "#/components/responses/Error"
          "404":
            $ref: "#/components/responses/Error"
          "409":
            $ref: "#/components/responses/Error"
          "500":
            $ref: "#/components/responses/Error"
    /api/v2/embed/session:
        get:
            tags: [API Embedded]
            operationId: obtenerSesionEmbedded
            summary: Recupera el contexto público de la sesión Embedded
            description: Deriva nuevamente el token CSRF de la sesión autenticada sin rotarla, extenderla ni exponer autoridad interna. No requiere Origin cuando el navegador lo omite en una lectura segura.
