            parameters: [{$ref: "#/components/parameters/CSRFEmbedded"}]
            summary: Elimina un punto de venta Embedded
            description: Requiere `points_of_sale:write`.
            security: [{EmbeddedSessionAuth: []}]
            responses: {"200": {description: Punto de venta eliminado, content: {application/json: {schema: {$ref: "#/components/schemas/RespuestaNula"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
    /api/v2/embed/arca/estado:
        get:
            tags: [API Embedded]
