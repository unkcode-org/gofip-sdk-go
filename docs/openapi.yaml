            operationId: subirCertificadoARCAEmbedded
            parameters: [{$ref: "#/components/parameters/CSRFEmbedded"}]
            summary: Completa una solicitud de certificado
            description: Requiere `arca:write`; sólo acepta la solicitud generada del emisor de sesión.
            security: [{EmbeddedSessionAuth: []}]
            requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: "#/components/schemas/CargarCertificadoARCAEmbedded"}}}}
            responses: {"200": {description: Metadata actualizada, content: {application/json: {schema: {$ref: "#/components/schemas/CredencialARCAEmbedded"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
