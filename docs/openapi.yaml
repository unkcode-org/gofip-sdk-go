            responses: {"200": {description: Cliente actualizado, content: {application/json: {schema: {$ref: "#/components/schemas/ClienteEmbedded"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
        delete:
