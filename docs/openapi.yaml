            - scopes
            - id
            - secret_prefix
            - status
            - created_at
            - updated_at
          properties:
            name: {type: string, minLength: 1, maxLength: 120, description: Nombre de esta Integration Key.}
            permissions: &a5
              type: array
              description: Permisos propios de esta credencial. Las capacidades nuevas heredan todo el conjunto; vacío impide emitir sesión/bootstrap. invoices:create está reservado, sin emisión manual Embedded.
              uniqueItems: true
              items:
                $ref: "#/components/schemas/PermisoEmbedded"
            scopes: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/AlcanceIntegracion"}, description: Scope M2M fijo embedded_session:create en gestión SEP.}
            id:
