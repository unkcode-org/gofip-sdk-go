            requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CuerpoValidarServiciosARCAEmbedded"}}}}
            responses: {"204": {description: Servicios validados}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
