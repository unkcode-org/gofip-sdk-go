            security: [{EmbeddedSessionAuth: []}]
            responses: {"200": {description: Metadata de credenciales, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CredencialARCAEmbedded"}}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
        post:
            tags: [API Embedded]
            operationId: crearCredencialARCAEmbedded
            parameters: [{$ref: "#/components/parameters/CSRFEmbedded"}]
            summary: Carga credencial propia o genera CSR
            description: Requiere `arca:write`. La clave privada de carga es transitoria; una clave generada queda exclusivamente en Vault y sólo se devuelve el CSR público.
            security: [{EmbeddedSessionAuth: []}]
            requestBody:
                required: true
                content:
                    application/json: {schema: {$ref: "#/components/schemas/CuerpoCrearSolicitudCredencialARCAEmbedded"}}
                    multipart/form-data: {schema: {$ref: "#/components/schemas/CargarCredencialARCAEmbedded"}}
            responses: {"201": {description: Metadata de credencial, content: {application/json: {schema: {$ref: "#/components/schemas/CredencialARCAEmbedded"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
    /api/v2/embed/arca/credenciales/{credencial-id}:
