                - EmbeddedSessionAuth: []
            parameters:
                - $ref: "#/components/parameters/LimiteCursor"
                - $ref: "#/components/parameters/CursorFacturas"
                - $ref: "#/components/parameters/OrdenFacturas"
                - $ref: "#/components/parameters/EstadoFactura"
                - $ref: "#/components/parameters/FechaDesdeFactura"
                - $ref: "#/components/parameters/FechaHastaFactura"
            responses:
                "200":
                    description: Página de facturas del emisor de la sesión
                    content: {application/json: {schema: {$ref: "#/components/schemas/PaginaFacturas"}}}
                "400": {$ref: "#/components/responses/Error"}
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
    /api/v2/embed/facturas/{factura-id}:
        get:
            tags: [API Embedded]
            operationId: obtenerFacturaEmbedded
            summary: Obtiene una factura del emisor Embedded
            description: Requiere `invoices:read`. Un identificador de otro emisor conserva el comportamiento opaco de no encontrado.
            security:
                - EmbeddedSessionAuth: []
            parameters:
                - name: factura-id
                  in: path
                  required: true
                  description: Identificador de la factura dentro del emisor de la sesión Embedded.
                  schema: {type: string}
            responses:
                "200":
                    description: Detalle de factura
                    content: {application/json: {schema: {$ref: "#/components/schemas/DetalleFacturaDocumento"}}}
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"
                "404":
                    $ref: "#/components/responses/Error"
