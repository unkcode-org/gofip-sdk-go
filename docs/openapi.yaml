                        required: [ambiente, estado, servicios]
                        properties:
                            ambiente: {type: string, enum: [homologacion, produccion]}
                            modo: {type: string, enum: [delegation, own_credential]}
                            estado: {type: string, enum: [sin_configurar, pendiente, conectado]}
                            servicios: {type: array, items: {$ref: "#/components/schemas/ServicioIntegracionARCA"}}
        ConfiguracionARCAEmbedded:
            type: object
            required: [ambiente, modo]
            properties:
                ambiente: {type: string, enum: [homologacion, produccion]}
                modo: {type: string, enum: [delegation, own_credential]}
        CredencialARCAEmbedded:
            type: object
            required: [id, ambiente, alias, cuit_operacion, identity_status, validation_status, lifecycle_status, fecha_emision, fecha_vencimiento]
            properties:
                id: {type: string, format: uuid}
                ambiente: {type: string, enum: [homologacion, produccion]}
                alias: {type: string}
                cuit_titular: {type: string}
                cuit_operacion: {type: string}
                identity_status: {type: string, enum: [confirmed, undetermined]}
                validation_status: {type: string, enum: [pending, valid, invalid]}
                lifecycle_status: {type: string, enum: [pending_certificate, pending_verification, inactive, active, superseded, expired, deleting]}
                fecha_emision: {type: string, format: date-time}
                fecha_vencimiento: {type: string, format: date-time}
                validation_error: {type: string}
                validated_at: {type: string, format: date-time}
        ResultadoConfirmarDelegacionARCAEmbedded:
            type: object
            required: [tareas_encoladas, integracion]
            properties:
                tareas_encoladas: {type: integer}
                integracion:
                    type: object
                    required: [cuit_emisor, delegado_a_cuit, servicios]
                    properties:
                        cuit_emisor: {type: string, pattern: "^[0-9]{11}$"}
                        delegado_a_cuit: {type: string, pattern: "^[0-9]{11}$"}
                        servicios: {type: array, items: {$ref: "#/components/schemas/ServicioIntegracionARCA"}}
        CuerpoCambiarModoARCAEmbedded:
            type: object
            required: [data]
            properties:
                data:
                    description: Modo de producción solicitado.
                    type: object
                    required: [modo]
                    properties:
                        modo: {type: string, enum: [delegation], description: Sólo se permite volver explícitamente al modo delegation.}
        CuerpoCrearSolicitudCredencialARCAEmbedded:
            type: object
            required: [data]
            properties:
                data:
                    description: Ambiente de la solicitud CSR que generará GOFIP.
                    type: object
                    required: [ambiente]
                    properties:
                        ambiente: {type: string, enum: [homologacion, produccion], description: Ambiente ARCA objetivo.}
        CargarCredencialARCAEmbedded:
            type: object
            required: [alias, ambiente, certificado, clave_privada]
            properties:
                alias: {type: string, description: Alias identificatorio local de la credencial.}
                ambiente: {type: string, enum: [homologacion, produccion], description: Ambiente ARCA de la credencial.}
                certificado: {type: string, format: binary, description: Certificado PEM a cargar.}
                clave_privada: {type: string, format: binary, description: Clave privada PEM transitoria; no se devuelve ni se conserva fuera de Vault.}
        CargarCertificadoARCAEmbedded:
            type: object
            required: [certificado]
            properties:
                certificado: {type: string, format: binary, description: Certificado X.509 emitido por ARCA en PEM o DER.}
        CuerpoValidarServiciosARCAEmbedded:
            type: object
            required: [data]
            properties:
                data:
                    description: Ambiente y servicios propios a validar.
                    type: object
                    required: [ambiente, servicios]
                    properties:
                        ambiente: {type: string, enum: [homologacion, produccion], description: Ambiente ARCA objetivo.}
                        servicios: {type: array, description: Códigos de servicios activos que se comprobarán., items: {type: string}}
        RespuestaCrearCredencialIntegracion:
            type: object
            required: [credential, secret]
            properties:
                credential: {$ref: "#/components/schemas/CredencialIntegracion"}
                secret:
                    type: string
                    readOnly: true
                    pattern: '^gofip_int_[A-Za-z0-9_-]{16}_[A-Za-z0-9_-]{43}$'
                    description: Valor completo mostrado únicamente al crear la credencial; GOFIP no puede recuperarlo después.
        CuerpoSolicitudFacturaRecurrente:
            type: object
            required: [data]
            properties:
                data: {$ref: "#/components/schemas/SolicitudFacturaRecurrente"}
        SolicitudFacturaRecurrente:
            type: object
            required: [nombre, cliente_id, factura, programacion, canales]
            properties:
                nombre:
                    type: string
                    minLength: 1
                    maxLength: 120
                    description: Nombre interno de la programación.
                cliente_id:
                    type: string
                    format: uuid
                    description: Cliente activo del mismo emisor que el punto de venta.
                factura:
                    description: Plantilla fiscal; los datos identificatorios del receptor se reemplazan con los valores actuales del cliente.
                    $ref: "#/components/schemas/ComprobanteWeb"
                metadatos:
                    description: Metadatos comerciales base; los datos de contacto y fiscales se toman del cliente en cada ejecución.
                    $ref: "#/components/schemas/MetadatosComprobanteWeb"
                programacion:
                    description: Calendario mensual y vigencia opcional.
                    $ref: "#/components/schemas/ProgramacionFacturaRecurrente"
                canales:
                    type: array
                    minItems: 1
                    description: Destinos explícitos a los que se enviará cada PDF.
                    items: {$ref: "#/components/schemas/CanalFacturaRecurrenteEntrada"}
        ProgramacionFacturaRecurrente:
            type: object
            required: [dia_mes, hora]
            properties:
                dia_mes:
                    type: integer
                    minimum: 1
                    maximum: 31
                    description: Día mensual; en meses más cortos se usa el último día.
                hora:
                    type: string
                    pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
                    example: "09:30"
                    description: Hora local mensual en formato HH:MM.
                zona_horaria:
                    type: string
                    default: America/Argentina/Buenos_Aires
                    description: Nombre de zona horaria IANA.
                vigente_desde: {type: string, format: date, description: Primer día desde el que puede ejecutarse la programación.}
                vigente_hasta: {type: string, format: date, description: Último día inclusivo en el que puede ejecutarse la programación.}
                dias_vencimiento_pago:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Días desde la fecha real de emisión para conceptos de servicio.
        CanalFacturaRecurrenteEntrada:
            type: object
            required: [tipo, destino]
            properties:
                tipo: {type: string, enum: [email, whatsapp], description: Medio por el que se entrega el PDF generado.}
                destino:
                    type: string
                    description: Email o número internacional, según el tipo.
                sesion_id:
                    type: string
                    description: Sesión OpenWA del emisor; obligatoria para WhatsApp.
                asunto:
                    type: string
                    maxLength: 255
                    description: Asunto personalizado del correo. Sólo aplica a email; si se omite se usa el asunto predeterminado.
                cuerpo:
                    type: string
                    maxLength: 10000
                    description: Cuerpo personalizado del correo. Sólo aplica a email; si se omite se usa el cuerpo predeterminado.
                texto_adjunto:
                    type: string
                    maxLength: 4096
                    description: Texto que acompaña al PDF adjunto. Sólo aplica a WhatsApp; si se omite se usa el texto predeterminado.
        FacturaRecurrente:
            type: object
            required: [factura_recurrente_id, punto_venta_id, cliente_id, usuario_id, nombre, factura, metadatos, programacion, estado, canales, created_at, updated_at]
            properties:
                factura_recurrente_id: {type: string, format: uuid}
                punto_venta_id: {type: string, format: uuid}
                cliente_id: {type: string, format: uuid}
                usuario_id: {type: string, format: uuid}
                nombre: {type: string}
                factura: {$ref: "#/components/schemas/ComprobanteWeb"}
                metadatos: {$ref: "#/components/schemas/MetadatosComprobanteWeb"}
                programacion:
                    allOf:
                        - $ref: "#/components/schemas/ProgramacionFacturaRecurrente"
                        - type: object
                          required: [proxima_ejecucion]
                          properties:
                              proxima_ejecucion: {type: string, format: date-time}
                estado: {type: string, enum: [activa, pausada, cancelada]}
                canales:
                    type: array
                    items: {$ref: "#/components/schemas/CanalFacturaRecurrente"}
                created_at: {type: string, format: date-time}
                updated_at: {type: string, format: date-time}
        CanalFacturaRecurrente:
            type: object
            required: [canal_id, tipo, destino]
            properties:
                canal_id: {type: string, format: uuid}
                tipo: {type: string, enum: [email, whatsapp]}
                destino: {type: string}
                sesion_id: {type: string}
                whatsapp_id: {type: string}
                asunto: {type: string, description: Asunto personalizado del correo.}
                cuerpo: {type: string, description: Cuerpo personalizado del correo.}
                texto_adjunto: {type: string, description: Texto personalizado que acompaña al PDF en WhatsApp.}
        EjecucionFacturaRecurrente:
            type: object
            required: [ejecucion_id, factura_recurrente_id, programada_para, estado, intentos, entregas, created_at, updated_at]
            properties:
                ejecucion_id: {type: string, format: uuid}
                factura_recurrente_id: {type: string, format: uuid}
                programada_para: {type: string, format: date-time}
                documento_id: {type: string, format: uuid}
                estado: {type: string, enum: [pendiente, procesando, completada, error]}
                intentos: {type: integer, minimum: 0}
                proximo_intento: {type: string, format: date-time}
                ultimo_error: {type: string}
                entregas:
                    type: array
                    items: {$ref: "#/components/schemas/EntregaFacturaRecurrente"}
                created_at: {type: string, format: date-time}
                updated_at: {type: string, format: date-time}
        EntregaFacturaRecurrente:
            type: object
            required: [entrega_id, canal_id, tipo, destino, estado, intentos, created_at, updated_at]
            properties:
                entrega_id: {type: string, format: uuid}
                canal_id: {type: string, format: uuid}
                tipo: {type: string, enum: [email, whatsapp]}
                destino: {type: string}
                sesion_id: {type: string}
                asunto: {type: string}
                cuerpo: {type: string}
                texto_adjunto: {type: string}
                estado: {type: string, enum: [pendiente, procesando, enviada, error]}
                intentos: {type: integer, minimum: 0}
                proximo_intento: {type: string, format: date-time}
                ultimo_error: {type: string}
                mensaje_id: {type: string}
                created_at: {type: string, format: date-time}
                updated_at: {type: string, format: date-time}
        CuerpoCrearSesionWhatsApp:
            type: object
            required: [data]
            properties:
                data: {description: Datos de la sesión a crear., $ref: "#/components/schemas/CrearSesionWhatsApp"}
        CrearSesionWhatsApp:
            type: object
            required: [nombre]
            properties:
                nombre: {type: string, minLength: 3, maxLength: 50, description: Nombre visible de la sesión dentro del emisor. El nombre técnico usado en OpenWA se genera internamente.}
                configuracion: {description: Parámetros opcionales de reconexión y llamadas., $ref: "#/components/schemas/ConfiguracionSesionWhatsApp"}
                url_proxy: {type: string, description: URL opcional del proxy de egreso.}
                tipo_proxy: {type: string, enum: [http, https, socks4, socks5], description: Tipo del proxy configurado.}
        ConfiguracionSesionWhatsApp:
            type: object
            properties:
                rechazar_llamadas_automaticamente: {type: boolean, description: Rechaza llamadas entrantes automáticamente.}
                maximos_intentos_reconexion: {type: integer, minimum: 0, maximum: 20, description: Máximo de reconexiones.}
                demora_base_reconexion: {type: integer, minimum: 1000, maximum: 300000, description: Demora base en milisegundos.}
        CuerpoCodigoVinculacionWhatsApp:
            type: object
            required: [data]
            properties:
                data: {description: Número que se vinculará., $ref: "#/components/schemas/CodigoVinculacionEntradaWhatsApp"}
        CodigoVinculacionEntradaWhatsApp:
            type: object
            required: [numero_telefono]
            properties:
                numero_telefono: {type: string, description: Número internacional compuesto sólo por dígitos.}
        CuerpoMensajeTextoWhatsApp:
            type: object
            required: [data]
            properties:
                data: {description: Mensaje de texto., $ref: "#/components/schemas/MensajeTextoWhatsApp"}
        MensajeTextoWhatsApp:
            type: object
            required: [chat_id, texto]
            properties:
                chat_id: {type: string, description: Identificador canónico del chat.}
                texto: {type: string, maxLength: 4096, description: Contenido del mensaje.}
                menciones: {type: array, items: {type: string}, description: Identificadores canónicos mencionados.}
                vista_previa_enlace: {type: boolean, description: Control opcional de vista previa.}
                vista_previa_personalizada: {description: Vista previa aportada por el caller., $ref: "#/components/schemas/VistaPreviaWhatsApp"}
                mensaje_citado_id: {type: string, description: ID engine-specific del mensaje citado.}
        VistaPreviaWhatsApp:
            type: object
            required: [url, titulo]
            properties:
                url: {type: string, description: URL incluida en el texto.}
                titulo: {type: string, maxLength: 256, description: Título de la vista previa.}
                descripcion: {type: string, maxLength: 1024, description: Descripción opcional.}
        CuerpoMensajeDocumentoWhatsApp:
            type: object
            required: [data]
            properties:
                data: {description: Documento o archivo a enviar., $ref: "#/components/schemas/MensajeDocumentoWhatsApp"}
        MensajeDocumentoWhatsApp:
            type: object
            required: [chat_id]
            properties:
                chat_id: {type: string, description: Identificador canónico del chat.}
                url: {type: string, description: URL HTTP o HTTPS del documento.}
                base64: {type: string, description: Contenido codificado en base64.}
                mime_type: {type: string, description: MIME type obligatorio con base64.}
                nombre_archivo: {type: string, description: Nombre mostrado al destinatario.}
                descripcion: {type: string, maxLength: 1024, description: Caption opcional.}
                menciones: {type: array, items: {type: string}, description: Identificadores canónicos mencionados.}
                mensaje_citado_id: {type: string, description: ID engine-specific del mensaje citado.}
        SesionWhatsApp:
            type: object
            properties:
                id: {type: string}
                nombre: {type: string, description: Nombre visible local de la sesión; no expone el identificador técnico usado en OpenWA.}
                estado: {type: string, enum: [created, initializing, qr_ready, authenticating, ready, disconnected, action_required, failed]}
                telefono: {type: string, nullable: true}
                nombre_visible: {type: string, nullable: true}
                conectada_en: {type: string, format: date-time, nullable: true}
                ultima_actividad: {type: string, format: date-time, nullable: true}
                creada_en: {type: string, format: date-time}
                actualizada_en: {type: string, format: date-time}
                ultimo_error: {type: string, nullable: true}
                restriccion: {$ref: "#/components/schemas/RestriccionWhatsApp"}
                motor_cargado: {type: boolean}
        RestriccionWhatsApp:
            type: object
            nullable: true
            properties:
                tipo: {type: string, enum: [reachout_timelock, tos_block, proxy_block]}
                codigo: {type: string}
                vence_en: {type: string, format: date-time, nullable: true}
        CodigoQRWhatsApp:
            type: object
            properties: {codigo_qr: {type: string}, estado: {type: string}}
        CodigoVinculacionWhatsApp:
            type: object
            properties: {codigo: {type: string}, estado: {type: string}}
        VerificacionNumeroWhatsApp:
            type: object
            properties: {numero: {type: string}, existe: {type: boolean}, whatsapp_id: {type: string, nullable: true}}
        ResultadoMensajeWhatsApp:
            type: object
            properties: {mensaje_id: {type: string}, timestamp: {type: number}}
        DetallesError:
            type: object
            description: Error HTTP compatible con RFC 7807 y extendido con un código estable de negocio y el ID de la solicitud.
            required: [code, type, title, status, detail, instance]
            properties:
                code:
                    type: string
                    description: Código estable de aplicación que permite identificar el error sin interpretar el texto.
                    example: "21000"
                type:
                    type: string
                    description: URI que identifica la clase del problema; actualmente se usa `about:blank`.
                    example: about:blank
                title:
                    type: string
                    description: Resumen técnico breve del error.
                    example: Cuerpo inválido o parámetros requeridos faltantes
                status:
                    type: integer
                    description: Código de estado HTTP de esta respuesta.
                    minimum: 400
                    maximum: 599
                    example: 400
                detail:
                    type: string
                    description: Explicación para el usuario localizada según `Accept-Language`.
                    example: Cuerpo inválido o parámetros requeridos faltantes
                instance:
                    type: string
                    description: Ruta de la solicitud que produjo el error.
                    example: /api/v2/documentos/comprobante
                request_id:
                    type: string
                    nullable: true
                    description: Identificador de trazabilidad asignado a la solicitud, cuando está disponible.

