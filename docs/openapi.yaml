            summary: Confirma delegaciones ARCA Embedded
            description: Requiere `arca:write`; aplica las reglas existentes de Feature A.
            security: [{EmbeddedSessionAuth: []}]
            requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CuerpoSolicitudConfirmarDelegacionARCA"}}}}
            responses: {"202": {description: Delegación encolada, content: {application/json: {schema: {$ref: "#/components/schemas/ResultadoConfirmarDelegacionARCAEmbedded"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
