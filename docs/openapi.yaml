            security: [{EmbeddedSessionAuth: []}]
            responses: {"200": {description: Configuraciones por ambiente, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ConfiguracionARCAEmbedded"}}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
