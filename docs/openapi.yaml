                "200":
                    description: Contexto mínimo de sesión
                    headers:
                        Cache-Control: {schema: {type: string, example: no-store}}
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/RespuestaContextoSesionEmbedded"}
                "401": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
    /api/v2/embed/facturas:
        get:
            tags: [API Embedded]
            operationId: listarFacturasEmbedded
            summary: Lista facturas del emisor Embedded
            description: Requiere `invoices:read`. El emisor se deriva exclusivamente de la sesión Embedded; no existe una operación Embedded para emitir facturas.
