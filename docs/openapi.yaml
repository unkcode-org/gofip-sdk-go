    /api/v2/emisores/{id-emisor}/arca/configuraciones/produccion:
        patch:
            tags: [Emisores]
            operationId: cambiarModoARCAProduccion
            summary: Cambia modo ARCA en producción
            description: Solo permite cambiar a delegation. Usa la credencial global GOFIP de producción, desactiva la credencial propia seleccionada y borra su selección efectiva. Para usar own_credential, activar explícitamente la credencial propia mediante POST /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/activar.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: {type: object, required: [data], properties: {data: {type: object, description: Datos del cambio de modo., required: [modo], properties: {modo: {type: string, description: Modo de producción., enum: [delegation]}}}}}
            responses:
                "204": {description: Modo cambiado}
                "400": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/servicios/validar:
        post:
            tags: [Emisores]
            operationId: validarServiciosARCAPropios
            summary: Valida acceso propio a servicios ARCA
            description: Con la credencial activa solicita un TA del servicio en el ambiente indicado; para WSFE consulta FEParamGetTiposConcepto. No crea tareas de delegación.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [data]
                            properties:
                                data:
                                    type: object
                                    description: Ambiente y servicios a validar.
                                    required: [ambiente, servicios]
                                    properties:
                                        ambiente: {type: string, description: Ambiente objetivo., enum: [homologacion, produccion]}
                                        servicios: {type: array, description: Códigos de servicios ARCA activos., items: {type: string}}
            responses:
                "204": {description: Servicios validados}
                "400": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
                "503": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales:
        get:
            tags: [Emisores]
            operationId: listarCredencialesARCAEmisor
            summary: Lista credenciales ARCA propias
            description: Devuelve únicamente metadata del emisor autenticado.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}]
            responses:
                "200":
                    description: Credenciales
                    content:
                        application/json:
                            schema: {type: array, items: {$ref: "#/components/schemas/ArcaCredentialMetadata"}}
                "403": {$ref: "#/components/responses/Error"}
        post:
            tags: [Emisores]
            operationId: subirCredencialARCAEmisor
            summary: Carga una credencial ARCA o genera su solicitud
            description: En multipart conserva la carga legacy de certificado y clave. En JSON, GOFIP genera una clave RSA y CSR que queda pendiente del certificado emitido por ARCA. La clave privada nunca se devuelve. El flujo generado solo queda activo tras verify exitoso contra WSAA.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}]
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [alias, ambiente, certificado, clave_privada]
                            properties:
                                alias: {type: string, description: Alias identificatorio.}
                                ambiente: {type: string, description: Ambiente donde se usará la credencial., enum: [homologacion, produccion]}
                                certificado: {type: string, description: Certificado PEM., format: binary}
                                clave_privada: {type: string, description: Clave privada PEM., format: binary}
                    application/json:
                        schema:
                            type: object
                            required: [data]
                            properties:
                                data:
                                    type: object
                                    description: Datos de la solicitud de certificado generada internamente.
                                    required: [ambiente]
                                    properties:
                                        ambiente: {type: string, description: Ambiente de ARCA para la solicitud, enum: [homologacion, produccion]}
            responses:
                "201":
                    description: Credencial legacy inactiva o solicitud de CSR pendiente
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/ArcaCredentialMetadata"}
                "400": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "413": {$ref: "#/components/responses/Error"}
                "503": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}:
        get:
            tags: [Emisores]
            operationId: obtenerCredencialARCAEmisor
            summary: Obtiene metadata de credencial propia
            description: Comprueba pertenencia del emisor y de la credencial.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de credencial ARCA, schema: {type: string, format: uuid}}]
            responses:
                "200":
                    description: Metadata
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/ArcaCredentialMetadata"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
        delete:
            tags: [Emisores]
            operationId: eliminarCredencialARCAEmisor
            summary: Elimina credencial inactiva
            description: No admite credenciales con lifecycle active, incluso si el modo efectivo es delegation; elimina material y metadata con reintento seguro.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de credencial ARCA, schema: {type: string, format: uuid}}]
            responses:
                "204": {description: Credencial eliminada}
                "403": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
                "503": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/validar:
        post:
            tags: [Emisores]
            operationId: revalidarCredencialARCAEmisor
            summary: Reintenta validación online
            description: Una falla transitoria conserva un estado valid o invalid anterior; para credenciales nunca validadas conserva pending y validated_at nulo. Un rechazo explícito queda invalid. validated_at registra solo una validación online exitosa.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de credencial ARCA, schema: {type: string, format: uuid}}]
            responses:
                "200":
                    description: Metadata actualizada
                    content:
                        application/json:
                            schema: {$ref: "#/components/schemas/ArcaCredentialMetadata"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/activar:
        post:
            tags: [Emisores]
            operationId: activarCredencialARCAEmisor
            summary: Activa credencial propia
            description: Selecciona explícitamente la credencial efectiva para emisor y ambiente, cambia ese ambiente a own_credential, supera la credencial activa anterior e invalida TAs. Requiere validación online exitosa previa, pertenencia al emisor, ambiente coincidente y vigencia temporal.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de credencial ARCA, schema: {type: string, format: uuid}}]
            responses:
                "204": {description: Credencial activada}
                "403": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}

    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/csr:
        get:
            tags: [Emisores]
            operationId: descargarSolicitudCertificadoARCA
            summary: Descarga el CSR generado por GOFIP
            description: Devuelve el CSR PEM generado por GOFIP. La clave privada nunca se devuelve.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de la solicitud ARCA, schema: {type: string, format: uuid}}]
            responses:
                "200": {description: Archivo CSR PEM, content: {application/pkcs10: {schema: {type: string, format: binary}}}}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/certificado:
        post:
            tags: [Emisores]
            operationId: subirCertificadoEmitidoARCA
            summary: Carga el certificado emitido para un CSR GOFIP
            description: Acepta certificado PEM o DER, verifica su vigencia y la correspondencia criptográfica con la clave almacenada en Vault. No activa la credencial hasta verify.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de la solicitud ARCA, schema: {type: string, format: uuid}}]
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [certificado]
                            properties:
                                certificado: {type: string, format: binary, description: "Certificado X.509 emitido por ARCA, en PEM o DER."}
            responses:
                "200": {description: Certificado almacenado y pendiente de verificación, content: {application/json: {schema: {$ref: "#/components/schemas/ArcaCredentialMetadata"}}}}
                "400": {$ref: "#/components/responses/Error"}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
    /api/v2/emisores/{id-emisor}/arca/credenciales/{credencial-id}/verify:
        post:
            tags: [Emisores]
            operationId: verificarConexionCredencialARCA
            summary: Verifica WSAA y activa la credencial generada
            description: Solicita un Ticket de Acceso para wsfe mediante la credencial almacenada. Token y firma nunca se devuelven; un éxito activa la credencial para ese emisor y ambiente.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}, {name: credencial-id, in: path, required: true, description: Identificador de la solicitud ARCA, schema: {type: string, format: uuid}}]
            responses:
                "200": {description: Conexión verificada, content: {application/json: {schema: {$ref: "#/components/schemas/ArcaConnectionVerification"}}}}
                "403": {$ref: "#/components/responses/Error"}
                "404": {$ref: "#/components/responses/Error"}
                "409": {$ref: "#/components/responses/Error"}
                "503": {$ref: "#/components/responses/Error"}

