        CredencialIntegracion:
            type: object
            required: [name, permissions, id, integration_client_id, secret_prefix, status, scopes, created_at, updated_at]
            properties:
                name: {type: string, minLength: 1, maxLength: 120, description: Nombre de la Integration Key.}
                permissions: *a5
                id: {type: string, format: uuid, description: UUIDv7 de la credencial.}
                integration_client_id: {type: string, format: uuid, description: Cliente de integración propietario.}
                secret_prefix: {type: string, example: gofip_int_abcdEFGH1234_567, description: Identificador público seguro para mostrar y buscar la credencial.}
                status: {$ref: "#/components/schemas/EstadoCredencialIntegracion"}
                expires_at: {type: string, format: date-time, nullable: true, description: Vencimiento opcional de la credencial.}
                revoked_at: {type: string, format: date-time, nullable: true, description: "Fecha de revocación, si corresponde."}
                scopes:
                    type: array
                    uniqueItems: true
                    description: Alcances M2M de la credencial; son independientes de los permisos Embedded de la misma credencial.
                    items: {$ref: "#/components/schemas/AlcanceIntegracion"}
                created_at: {type: string, format: date-time, description: Fecha de creación.}
                updated_at: {type: string, format: date-time, description: Fecha de última actualización.}
        RespuestaCredencialesIntegracion:
            type: object
            required: [credentials]
            properties:
                credentials:
                    type: array
                    description: Metadatos seguros de las credenciales del cliente solicitado.
