        get:
            tags: [Emisores]
            operationId: listarConfiguracionesARCA
            summary: Lista configuraciones ARCA del emisor
            description: Homologación admite solo own_credential; producción admite delegation u own_credential.
            security: [{CookieAuth: []}]
            parameters: [{$ref: "#/components/parameters/IdEmisor"}]
            responses:
                "200":
                    description: Configuraciones existentes
                    content:
